name: STRACKER Mobile Source Snapshot

on:
  pull_request:
    branches:
      - fix/stracker-p0-security-canonical-state
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/stracker-mobile-session-product-v1
          fetch-depth: 0
      - name: Verify exact branch ancestry
        run: |
          test "$(git merge-base HEAD origin/fix/stracker-p0-security-canonical-state)" = "fa919edad57937481f97e74ac96f09697bf03642"
          printf '%s\n' "$(git rev-parse HEAD)" > SOURCE_HEAD_SHA.txt
      - uses: actions/upload-artifact@v4
        with:
          name: stracker-mobile-source-snapshot
          path: |
            .
            !.git
            !node_modules
            !.next
            !out
          include-hidden-files: true
          if-no-files-found: error
