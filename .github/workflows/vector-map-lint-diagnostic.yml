name: STRACKER Vector Map Lint Diagnostic

on:
  pull_request:
    branches:
      - feat/stracker-cloudflare-private-gateway-poc
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4
      - run: bun install --frozen-lockfile
      - name: Capture lint
        continue-on-error: true
        run: |
          set -o pipefail
          bun run lint 2>&1 | tee /tmp/vector-map-eslint.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vector-map-eslint-${{ github.event.pull_request.head.sha }}
          path: /tmp/vector-map-eslint.log
          retention-days: 2
