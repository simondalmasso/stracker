name: STRACKER P0 Finalize

on:
  pull_request:
    branches: [main]
    types: [synchronize]
    paths:
      - .github/workflows/p0-finalize.yml

permissions:
  contents: write

concurrency:
  group: stracker-p0-finalize
  cancel-in-progress: false

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BASE_SHA: 923cac9c9bcc0b7e05701dd1018e61a454d0f478
      STRACKER_ENV: test
      STRACKER_API_TOKEN: test-service-token-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
      SECRET_KEY: test-secret-key-ssssssssssssssssssssssssssssssssssssssssssssssss
      TRACKER_SKIP_PLAYWRIGHT: '1'
      NEXT_TELEMETRY_DISABLED: '1'

    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4
        with:
          ref: fix/stracker-p0-security-canonical-state
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify exact baseline and clean checkout
        shell: bash
        run: |
          set -euo pipefail
          git fetch --prune origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          git merge-base --is-ancestor "$BASE_SHA" HEAD
          test -z "$(git status --porcelain)"
          git worktree add --detach /tmp/stracker-base "$BASE_SHA"

      - name: Apply final security hardening
        shell: python
        run: |
          from pathlib import Path
          import textwrap

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {count}')
              return text.replace(old, new, 1)

          tracker_path = Path('tracker_map.py')
          tracker = tracker_path.read_text(encoding='utf-8')
          tracker = replace_once(
              tracker,
              '''except ImportError:
              _AESGCM_AVAILABLE = False
              logger.warning("cryptography package not available — ghostrail.enc disabled (CSV remains canonical)")'''.replace('          ', ''),
              '''except ImportError:
              _AESGCM_AVAILABLE = False
              logging.getLogger(__name__).warning(
                  "cryptography package not available — encrypted storage unavailable"
              )'''.replace('          ', ''),
              'cryptography import handling',
          )
          for endpoint in ('/api/archive', '/ghostrail/encrypted', '/predict', '/points'):
              old = f'''logger.error("{endpoint} error: %s", e)
                      self._send_json({{"status": "error", "error": str(e)}}, status=500)'''.replace('                  ', '')
              new = f'''logger.error("{endpoint} error: %s", e)
                      self._send_json({{"status": "error", "error": "internal_error"}}, status=500)'''.replace('                  ', '')
              tracker = replace_once(tracker, old, new, f'{endpoint} generic error')
          tracker_path.write_text(tracker, encoding='utf-8')
          Path('nextjs-ui/tracker_map.py').write_text(tracker, encoding='utf-8')

          api_client = textwrap.dedent('''
              /**
               * Same-origin API client for the transitional STRACKER architecture.
               *
               * The browser does not mint or inject credentials. Cloudflare Access
               * will authenticate the user at the edge, and the private Worker
               * gateway will attach the server-only service token when proxying to
               * the temporary Render ingestion runtime. A service token must never
               * be embedded in browser code, localStorage, or a static export.
               */

              export interface FetchWithAuthOptions extends RequestInit {
                /** Deprecated compatibility option; no browser auth header is generated. */
                skipAuth?: boolean
              }

              function toRequestInit(options: FetchWithAuthOptions): RequestInit {
                const { skipAuth: _skipAuth, ...init } = options
                return { credentials: 'same-origin', ...init }
              }

              /**
               * Compatibility name retained for existing callers. Authentication is
               * enforced by the edge and origin, not by a client-generated token.
               */
              export async function fetchWithAuth(
                url: string,
                options: FetchWithAuthOptions = {},
              ): Promise<Response> {
                return fetch(url, toRequestInit(options))
              }

              export async function apiGet<T = unknown>(
                url: string,
                options?: FetchWithAuthOptions,
              ): Promise<T> {
                const resp = await fetchWithAuth(url, { ...options, method: 'GET' })
                if (!resp.ok) throw new Error(`apiGet ${url} → HTTP ${resp.status}`)
                return resp.json() as Promise<T>
              }

              export async function apiPost<T = unknown>(
                url: string,
                body: unknown,
                options?: FetchWithAuthOptions,
              ): Promise<T> {
                const headers = new Headers(options?.headers)
                headers.set('Content-Type', 'application/json')
                const resp = await fetchWithAuth(url, {
                  ...options,
                  method: 'POST',
                  headers,
                  body: JSON.stringify(body),
                })
                if (!resp.ok) throw new Error(`apiPost ${url} → HTTP ${resp.status}`)
                return resp.json() as Promise<T>
              }
          ''').strip() + '\n'
          Path('src/lib/api-client.ts').write_text(api_client, encoding='utf-8')
          auth_path = Path('src/lib/auth.ts')
          if auth_path.exists():
              auth_path.unlink()

          requirements = Path('requirements.txt').read_text(encoding='utf-8')
          requirements = requirements.replace(
              '# Falls back gracefully to plaintext CSV if not installed (dev mode).',
              '# Optional only in development/tests; production startup fails closed if unavailable.',
          )
          Path('requirements.txt').write_text(requirements, encoding='utf-8')

          tests_path = Path('tests/test_p0_security.py')
          tests = tests_path.read_text(encoding='utf-8')
          insertion = textwrap.dedent('''
              def test_internal_errors_use_generic_response(self):
                  original = tracker_map.read_encrypted_ghostrail

                  def explode():
                      raise RuntimeError("private-runtime-detail")

                  tracker_map.read_encrypted_ghostrail = explode
                  try:
                      with running_server() as port:
                          status, _, payload = request(
                              port,
                              "GET",
                              "/ghostrail/encrypted",
                              headers=self.auth_headers(),
                          )
                          self.assertEqual(status, 500)
                          self.assertEqual(
                              json.loads(payload),
                              {"status": "error", "error": "internal_error"},
                          )
                          self.assertNotIn(b"private-runtime-detail", payload)
                  finally:
                      tracker_map.read_encrypted_ghostrail = original

              def test_browser_client_does_not_generate_bearer_tokens(self):
                  root = Path(__file__).resolve().parents[1]
                  api_client = (root / "src" / "lib" / "api-client.ts").read_text(encoding="utf-8")
                  for forbidden in (
                      "getBearerToken",
                      "ensureSession",
                      "clearSession",
                      "localStorage",
                      "headers.set('Authorization'",
                  ):
                      self.assertNotIn(forbidden, api_client)
                  self.assertIn("credentials: 'same-origin'", api_client)
                  self.assertFalse((root / "src" / "lib" / "auth.ts").exists())

          ''')
          marker = '\n\nif __name__ == "__main__":\n'
          if tests.count(marker) != 1:
              raise SystemExit('test insertion marker not unique')
          tests = tests.replace(marker, '\n\n' + textwrap.indent(insertion, '    ') + marker, 1)
          tests_path.write_text(tests, encoding='utf-8')

          audit_path = Path('docs/SECURITY_AUDIT_SANITIZED.md')
          audit = audit_path.read_text(encoding='utf-8')
          audit = '\n'.join(line[8:] if line.startswith('        ') else line for line in audit.splitlines()) + '\n'
          audit = audit.replace(
              '| HIGH | client_generated_bearer_token | `src/lib/auth.ts, src/lib/api-client.ts` | likely_real_configuration_or_code_reference | history_present | 923cac9c9bcc | not_applicable | move private configuration out of source and complete manual rotation when applicable |',
              '| HIGH | historical_client_generated_bearer_token | `src/lib/auth.ts, src/lib/api-client.ts` | removed_from_active_source_in_this_branch | history_present | 923cac9c9bcc | not_applicable | retain as historical finding; active browser token minting removed |',
          )
          audit_path.write_text(audit, encoding='utf-8')

          security_path = Path('docs/SECURITY.md')
          security = security_path.read_text(encoding='utf-8')
          security = security.replace(
              'Tokens are compared with `hmac.compare_digest`. Missing server configuration returns a generic `503`; missing or incorrect credentials return a generic `401`. CORS remains defense-in-depth and is not authentication.',
              'Tokens are compared with `hmac.compare_digest`. Missing server configuration returns a generic `503`; missing or incorrect credentials return a generic `401`. CORS remains defense-in-depth and is not authentication. The previous browser-generated Bearer token module was removed from the active source path.',
          )
          security_path.write_text(security, encoding='utf-8')

          current_path = Path('docs/CURRENT_STATE.md')
          current = current_path.read_text(encoding='utf-8')
          current = current.replace(
              '- `AUTH_MODEL`: protected Python endpoints require `STRACKER_API_TOKEN` via Bearer or `X-Stracker-Service-Token`, validated server-side with constant-time comparison.',
              '- `AUTH_MODEL`: protected Python endpoints require `STRACKER_API_TOKEN` via Bearer or `X-Stracker-Service-Token`, validated server-side with constant-time comparison. Browser-side token minting has been removed; the future edge gateway owns origin credentials.',
          )
          current_path.write_text(current, encoding='utf-8')

      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Run Python security gates
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile tracker_map.py nextjs-ui/tracker_map.py stracker_security.py tests/test_p0_security.py
          python -m unittest discover -s tests -p 'test_*.py' -v 2>&1 | tee /tmp/python-tests-final.log
          cmp tracker_map.py nextjs-ui/tracker_map.py
          git diff --check

      - name: Diagnose frozen install and run frontend checks
        shell: bash
        run: |
          set -euo pipefail
          capture() {
            local name="$1"
            shift
            set +e
            "$@" >"/tmp/${name}.log" 2>&1
            local code=$?
            set -e
            echo "$code" >"/tmp/${name}.code"
            printf '%s=%s\n' "$name" "$code"
          }

          capture base_npm_ci bash -lc 'cd /tmp/stracker-base && npm ci --ignore-scripts'
          capture candidate_npm_ci npm ci --ignore-scripts

          capture base_npm_install bash -lc 'cd /tmp/stracker-base && npm install --ignore-scripts --package-lock=false --no-audit --no-fund'
          capture candidate_npm_install npm install --ignore-scripts --package-lock=false --no-audit --no-fund

          if [ "$(cat /tmp/base_npm_install.code)" = "0" ]; then
            capture base_lint bash -lc 'cd /tmp/stracker-base && npx eslint .'
            capture base_typecheck bash -lc 'cd /tmp/stracker-base && npx tsc --noEmit'
            capture base_build bash -lc 'cd /tmp/stracker-base && npx next build'
          else
            echo 125 > /tmp/base_lint.code
            echo 125 > /tmp/base_typecheck.code
            echo 125 > /tmp/base_build.code
          fi

          if [ "$(cat /tmp/candidate_npm_install.code)" = "0" ]; then
            capture candidate_lint npx eslint .
            capture candidate_typecheck npx tsc --noEmit
            capture candidate_build npx next build
          else
            echo 125 > /tmp/candidate_lint.code
            echo 125 > /tmp/candidate_typecheck.code
            echo 125 > /tmp/candidate_build.code
          fi

          for check in npm_install lint typecheck build; do
            base_code="$(cat "/tmp/base_${check}.code")"
            candidate_code="$(cat "/tmp/candidate_${check}.code")"
            if [ "$base_code" = "0" ] && [ "$candidate_code" != "0" ]; then
              echo "Frontend regression in ${check}: base=0 candidate=${candidate_code}" >&2
              exit 1
            fi
          done

      - name: Write exact sanitized validation evidence
        shell: python
        run: |
          from pathlib import Path
          import os
          import re

          def exit_code(name):
              return int(Path(f'/tmp/{name}.code').read_text().strip())

          def classify_npm_ci(name):
              raw = Path(f'/tmp/{name}.log').read_text(encoding='utf-8', errors='replace')
              lower = raw.lower()
              if 'package.json and package-lock.json are in sync' in lower:
                  kind = 'LOCKFILE_OUT_OF_SYNC'
              elif 'eresolve' in lower:
                  kind = 'DEPENDENCY_RESOLUTION_CONFLICT'
              elif 'eusage' in lower:
                  kind = 'NPM_CI_EUSAGE'
              elif 'enoent' in lower:
                  kind = 'MISSING_FILE'
              else:
                  kind = 'UNCLASSIFIED_NPM_CI_FAILURE'
              missing = len(re.findall(r'^npm error Missing:', raw, flags=re.MULTILINE))
              invalid = len(re.findall(r'^npm error Invalid:', raw, flags=re.MULTILINE))
              return kind, missing, invalid

          def compare(label):
              base = exit_code(f'base_{label}')
              candidate = exit_code(f'candidate_{label}')
              if candidate == 0:
                  status = 'PASS'
              elif base != 0:
                  status = 'PREEXISTING_FAIL'
              else:
                  status = 'REGRESSION'
              return status, base, candidate

          base_kind, base_missing, base_invalid = classify_npm_ci('base_npm_ci')
          candidate_kind, candidate_missing, candidate_invalid = classify_npm_ci('candidate_npm_ci')
          tests_log = Path('/tmp/python-tests-final.log').read_text(encoding='utf-8', errors='replace')
          match = re.search(r'Ran (\d+) tests?', tests_log)
          tests = match.group(1) if match else 'unparsed'

          rows = []
          for label in ('npm_install', 'lint', 'typecheck', 'build'):
              rows.append((label, *compare(label)))

          lines = [
              '# P0 Validation Evidence',
              '',
              'Validation ran in clean GitHub Actions checkouts. No production endpoint, deployment or secret store was modified.',
              '',
              '```text',
              'BASE_SHA=923cac9c9bcc0b7e05701dd1018e61a454d0f478',
              'IMPLEMENTATION_RUN=29825436822',
              f'FINAL_HARDENING_RUN={os.environ.get("GITHUB_RUN_ID", "unknown")}',
              'PRODUCTION_MODIFIED=NO',
              'DEPLOYMENT_EXECUTED=NO',
              '```',
              '',
              '## Backend gates',
              '',
              '| Command | Result | Exact status |',
              '|---|---|---|',
              '| `python -m py_compile tracker_map.py nextjs-ui/tracker_map.py stracker_security.py tests/test_p0_security.py` | PASS | exit 0 |',
              f'| `python -m unittest discover -s tests -p test_*.py -v` | PASS | exit 0; tests={tests} |',
              '| `cmp tracker_map.py nextjs-ui/tracker_map.py` | PASS | exit 0 |',
              '| `git diff --check` | PASS | exit 0 |',
              '',
              '## Frozen dependency gate',
              '',
              '| Checkout | Command | Exit | Classification | Missing entries | Invalid entries |',
              '|---|---|---:|---|---:|---:|',
              f'| Base | `npm ci --ignore-scripts` | {exit_code("base_npm_ci")} | {base_kind} | {base_missing} | {base_invalid} |',
              f'| Candidate | `npm ci --ignore-scripts` | {exit_code("candidate_npm_ci")} | {candidate_kind} | {candidate_missing} | {candidate_invalid} |',
              '',
              'The frozen npm install failure is preexisting when base and candidate have the same classification and counts. Package names and raw logs are intentionally omitted from committed evidence.',
              '',
              '## Ephemeral frontend comparison',
              '',
              'Because the frozen lockfile gate fails, the checks below use `npm install --ignore-scripts --package-lock=false` only inside the disposable runner. This does not modify the committed lockfile and is not a release build.',
              '',
              '| Check | Classification | Base exit | Candidate exit |',
              '|---|---|---:|---:|',
          ]
          for label, status, base, candidate in rows:
              lines.append(f'| `{label}` | {status} | {base} | {candidate} |')
          lines.extend([
              '',
              '## Integrity and scope',
              '',
              '- Browser-generated Bearer token code removed from the active source path.',
              '- Sensitive endpoint exceptions return generic client errors while full details remain server-side logs only.',
              '- Production impact: none.',
              '- Deployment: not executed.',
          ])
          Path('docs/P0_VALIDATION.md').write_text('\n'.join(lines) + '\n', encoding='utf-8')

      - name: Commit finalized P0 branch
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile tracker_map.py nextjs-ui/tracker_map.py stracker_security.py tests/test_p0_security.py
          cmp tracker_map.py nextjs-ui/tracker_map.py
          git diff --check
          rm -f .github/workflows/p0-finalize.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'security: finalize P0 containment evidence'
          git push origin HEAD:fix/stracker-p0-security-canonical-state
          printf 'FINAL_HEAD=%s\n' "$(git rev-parse HEAD)"
