name: STRACKER Native Sharing Cloudflare State Reconcile

on:
  pull_request:
    branches:
      - feat/stracker-native-location-sharing-v1
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: read

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Reconcile canonical bounded tranche state
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          state_path = Path('docs/CURRENT_STATE.md')
          state = state_path.read_text(encoding='utf-8')

          first_note = "This run is evidence only for that exact SHA. The helper and documentation reconciliation that follow require a new full pipeline and must not reuse run `29980429089` as evidence for their new SHA."
          second_block = """This run is evidence only for that exact SHA.

## Second intermediate green baseline

The helper and canonical-document reconciliation completed on an exact second intermediate baseline:

```text
SECOND_INTERMEDIATE_GREEN_HEAD=7f91ca6a822107a1e242267c8c2c56da1923118c
SECOND_INTERMEDIATE_GREEN_RUN=29981034009
SECOND_INTERMEDIATE_GREEN_CONCLUSION=success

CURRENT_HELPER_AND_DOCS_PIPELINE=PASS
BOUNDED_TRANCHE_STATUS=COMPLETE
BOUNDED_TRANCHE_CANONICALLY_RECONCILED=YES
```

Run `29981034009` is evidence only for exact SHA `7f91ca6a822107a1e242267c8c2c56da1923118c`. No dynamic SHA or run marker is required in this document for later documentation-only commits."""
          if first_note not in state:
              raise SystemExit('FIRST_INTERMEDIATE_NOTE_MISSING')
          state = state.replace(first_note, second_block, 1)
          state = state.replace(
              "The helper and documentation changes after the first intermediate green baseline require a second full pipeline on their exact new SHA. Until that run succeeds:\n\n```text\nCURRENT_HELPER_AND_DOCS_PIPELINE=PENDING_NEW_HEAD_CI\nPR_9_TECHNICALLY_READY=NO\n```",
              "The helper and documentation reconciliation passed a second full pipeline on exact SHA `7f91ca6a822107a1e242267c8c2c56da1923118c` in run `29981034009`:\n\n```text\nCURRENT_HELPER_AND_DOCS_PIPELINE=PASS\nBOUNDED_TRANCHE_STATUS=COMPLETE\nBOUNDED_TRANCHE_CANONICALLY_RECONCILED=YES\nPR_9_TECHNICALLY_READY=NO\n```",
          )
          state = state.replace('CURRENT_HELPER_AND_DOCS_PIPELINE=PENDING_NEW_HEAD_CI', 'CURRENT_HELPER_AND_DOCS_PIPELINE=PASS')
          state = state.replace('SECOND_EXACT_HEAD_PIPELINE=PENDING\n', '')

          tail = """## Open risks

```text
FINAL_BROWSER_QA=NOT_EXECUTED
FINAL_SIX_FILE_ARTIFACT=NOT_CREATED
PR_9_TECHNICALLY_READY=NO
A22_PHYSICAL_VALIDATION=NOT_EXECUTED_ENV_BLOCKED
```

## Next exact step

```text
NEXT_EXACT_STEP=AWAIT_NEW_JEFATURA_TRANCHE_DECISION
```
"""
          state, count = re.subn(r'## Open risks\n.*\Z', tail, state, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('OPEN_RISKS_SECTION_MISSING')

          required = {
              'SECOND_INTERMEDIATE_GREEN_HEAD=7f91ca6a822107a1e242267c8c2c56da1923118c',
              'SECOND_INTERMEDIATE_GREEN_RUN=29981034009',
              'SECOND_INTERMEDIATE_GREEN_CONCLUSION=success',
              'CURRENT_HELPER_AND_DOCS_PIPELINE=PASS',
              'BOUNDED_TRANCHE_STATUS=COMPLETE',
              'BOUNDED_TRANCHE_CANONICALLY_RECONCILED=YES',
              'NEXT_EXACT_STEP=AWAIT_NEW_JEFATURA_TRANCHE_DECISION',
          }
          lines = set(state.splitlines())
          if required.difference(lines):
              raise SystemExit('RECONCILED_STATE_MISSING')
          for forbidden in (
              'CURRENT_HELPER_AND_DOCS_PIPELINE=PENDING_NEW_HEAD_CI',
              'SECOND_EXACT_HEAD_PIPELINE=PENDING',
          ):
              if forbidden in state:
                  raise SystemExit('RECONCILED_STATE_PENDING_MARKER')
          state_path.write_text(state, encoding='utf-8')
          PY
          git diff --check
          test "$(git status --short | wc -l)" -eq 1
          git status --short | grep -q '^ M docs/CURRENT_STATE.md$'
      - name: Commit canonical state only
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name 'stracker-ci'
          git config user.email 'stracker-ci@users.noreply.github.com'
          git add docs/CURRENT_STATE.md
          git commit -m 'docs: complete bounded Phase B state'
          git push origin "HEAD:$HEAD_BRANCH"
