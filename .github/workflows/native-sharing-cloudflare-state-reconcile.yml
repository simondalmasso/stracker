name: STRACKER Native Sharing Cloudflare State Reconcile

on:
  pull_request:
    branches:
      - feat/stracker-native-location-sharing-v1
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: read

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Reconcile canonical bounded tranche state
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          state_path = Path('docs/CURRENT_STATE.md')
          state = state_path.read_text(encoding='utf-8')

          first_note = "This run is evidence only for that exact SHA. The helper and documentation reconciliation that follow require a new full pipeline and must not reuse run `29980429089` as evidence for their new SHA."
          second_block = """This run is evidence only for that exact SHA.\n\n## Second intermediate green baseline\n\nThe helper and canonical-document reconciliation completed on an exact second intermediate baseline:\n\n```text\nSECOND_INTERMEDIATE_GREEN_HEAD=7f91ca6a822107a1e242267c8c2c56da1923118c\nSECOND_INTERMEDIATE_GREEN_RUN=29981034009\nSECOND_INTERMEDIATE_GREEN_CONCLUSION=success\n\nCURRENT_HELPER_AND_DOCS_PIPELINE=PASS\nBOUNDED_TRANCHE_STATUS=COMPLETE\nBOUNDED_TRANCHE_CANONICALLY_RECONCILED=YES\n```\n\nRun `29981034009` is evidence only for exact SHA `7f91ca6a822107a1e242267c8c2c56da1923118c`. No dynamic SHA or run marker is required in this document for later documentation-only commits."""
          if first_note not in state:
              raise SystemExit('FIRST_INTERMEDIATE_NOTE_MISSING')
          state = state.replace(first_note, second_block, 1)
          state = state.replace('CURRENT_HELPER_AND_DOCS_PIPELINE=PENDING_NEW_HEAD_CI', 'CURRENT_HELPER_AND_DOCS_PIPELINE=PASS')
          state = state.replace('SECOND_EXACT_HEAD_PIPELINE=PENDING\n', '')

          tail = """## Open risks\n\n```text\nFINAL_BROWSER_QA=NOT_EXECUTED\nFINAL_SIX_FILE_ARTIFACT=NOT_CREATED\nPR_9_TECHNICALLY_READY=NO\nA22_PHYSICAL_VALIDATION=NOT_EXECUTED_ENV_BLOCKED\n```\n\n## Next exact step\n\n```text\nNEXT_EXACT_STEP=AWAIT_NEW_JEFATURA_TRANCHE_DECISION\n```\n"""
          state, count = re.subn(r'## Open risks\n.*\Z', tail, state, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('OPEN_RISKS_SECTION_MISSING')

          required_state = {
              'SECOND_INTERMEDIATE_GREEN_HEAD=7f91ca6a822107a1e242267c8c2c56da1923118c',
              'SECOND_INTERMEDIATE_GREEN_RUN=29981034009',
              'SECOND_INTERMEDIATE_GREEN_CONCLUSION=success',
              'CURRENT_HELPER_AND_DOCS_PIPELINE=PASS',
              'BOUNDED_TRANCHE_STATUS=COMPLETE',
              'BOUNDED_TRANCHE_CANONICALLY_RECONCILED=YES',
              'NEXT_EXACT_STEP=AWAIT_NEW_JEFATURA_TRANCHE_DECISION',
          }
          lines = set(state.splitlines())
          if required_state.difference(lines):
              raise SystemExit('RECONCILED_STATE_MISSING')
          for forbidden in (
              'CURRENT_HELPER_AND_DOCS_PIPELINE=PENDING_NEW_HEAD_CI',
              'SECOND_EXACT_HEAD_PIPELINE=PENDING',
          ):
              if forbidden in state:
                  raise SystemExit('RECONCILED_STATE_PENDING_MARKER')
          state_path.write_text(state, encoding='utf-8')

          workflow_path = Path('.github/workflows/native-sharing-cloudflare-runtime-v1.yml')
          workflow = workflow_path.read_text(encoding='utf-8')
          old_required = """              'LEGACY_BASELINE_SHA=1b8bc4b79c63e36f5f6d7bb8a7fc39f0a782c930',\n              'LEGACY_BASELINE_RUN=29974437874',\n              'LEGACY_BASELINE_ARTIFACT=8550899250',\n              'LEGACY_GREEN_SCOPE=SUPERSEDED_CONTRACT_ONLY',\n              'PR_9_TECHNICALLY_READY=NO',\n              'FINAL_ARTIFACT=NO',\n              'CURRENT_REWORK=EXPORTS_SQLITE_ATOMICITY_WORKERD',\n"""
          new_required = old_required + """              'SECOND_INTERMEDIATE_GREEN_HEAD=7f91ca6a822107a1e242267c8c2c56da1923118c',\n              'SECOND_INTERMEDIATE_GREEN_RUN=29981034009',\n              'SECOND_INTERMEDIATE_GREEN_CONCLUSION=success',\n              'CURRENT_HELPER_AND_DOCS_PIPELINE=PASS',\n              'BOUNDED_TRANCHE_STATUS=COMPLETE',\n"""
          if old_required not in workflow:
              raise SystemExit('STATE_TRUTH_REQUIRED_BLOCK_MISSING')
          workflow = workflow.replace(old_required, new_required, 1)
          old_forbidden = "          forbidden = ('new_sqlite_classes migration', '\\npoints\\nviewer_sessions')"
          new_forbidden = """          forbidden = (\n              'new_sqlite_classes migration',\n              '\\npoints\\nviewer_sessions',\n              'CURRENT_HELPER_AND_DOCS_PIPELINE=PENDING_NEW_HEAD_CI',\n              'SECOND_EXACT_HEAD_PIPELINE=PENDING',\n          )"""
          if old_forbidden not in workflow:
              raise SystemExit('STATE_TRUTH_FORBIDDEN_BLOCK_MISSING')
          workflow = workflow.replace(old_forbidden, new_forbidden, 1)
          workflow_path.write_text(workflow, encoding='utf-8')

          Path('.github/workflows/native-sharing-cloudflare-state-reconcile.yml').unlink()
          PY
          git diff --check
          test "$(git status --short | wc -l)" -eq 3
          git status --short | grep -q '^ M .github/workflows/native-sharing-cloudflare-runtime-v1.yml$'
          git status --short | grep -q '^ M docs/CURRENT_STATE.md$'
          git status --short | grep -q '^ D .github/workflows/native-sharing-cloudflare-state-reconcile.yml$'
      - name: Commit canonical reconciliation
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name 'stracker-ci'
          git config user.email 'stracker-ci@users.noreply.github.com'
          git add -A
          git commit -m 'docs: complete bounded Phase B reconciliation'
          git push origin "HEAD:$HEAD_BRANCH"
