name: STRACKER Native Sharing Cloudflare Logical Rows Fix

on:
  pull_request:
    branches:
      - feat/stracker-native-location-sharing-v1
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4
      - name: Frozen install
        run: bun install --frozen-lockfile
      - name: Apply logical row-count correction
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          store_path = Path('native-sharing-cloudflare/src/sqlite-store.ts')
          store = store_path.read_text()
          old_executor = """export interface RuntimeSqlExecutor {
            exec<T extends RuntimeSqlRow = RuntimeSqlRow>(query: string, ...bindings: RuntimeSqlValue[]): RuntimeSqlCursor<T>
            transactionSync<T>(callback: () => T): T
          }
          """
          new_executor = """export interface RuntimeSqlExecutor {
            exec<T extends RuntimeSqlRow = RuntimeSqlRow>(query: string, ...bindings: RuntimeSqlValue[]): RuntimeSqlCursor<T>
            logicalRowsWritten(): number
            transactionSync<T>(callback: () => T): T
          }
          """
          if old_executor not in store:
              raise SystemExit('RuntimeSqlExecutor marker missing')
          store = store.replace(old_executor, new_executor)
          old_helper = """function completedRowsWritten(cursor: RuntimeSqlCursor<RuntimeSqlRow>): number {
            cursor.toArray()
            return cursor.rowsWritten
          }
          """
          new_helper = """function completedLogicalRowsWritten(
            cursor: RuntimeSqlCursor<RuntimeSqlRow>,
            sql: RuntimeSqlExecutor,
          ): number {
            cursor.toArray()
            return sql.logicalRowsWritten()
          }
          """
          if old_helper not in store:
              raise SystemExit('completedRowsWritten marker missing')
          store = store.replace(old_helper, new_helper)
          store, replacements = re.subn(
              r'completedRowsWritten\(([A-Za-z][A-Za-z0-9_]*)\)',
              r'completedLogicalRowsWritten(\1, this.sql)',
              store,
          )
          if replacements < 6:
              raise SystemExit(f'expected at least 6 write checks, found {replacements}')
          if 'completedRowsWritten(' in store:
              raise SystemExit('legacy completedRowsWritten call remains')
          store_path.write_text(store)

          durable_path = Path('native-sharing-cloudflare/src/durable-object.ts')
          durable = durable_path.read_text()
          marker = """    exec<T extends RuntimeSqlRow = RuntimeSqlRow>(query: string, ...bindings: RuntimeSqlValue[]) {
                return storage.sql.exec<T>(query, ...bindings)
              },
              transactionSync<T>(callback: () => T): T {
          """
          replacement = """    exec<T extends RuntimeSqlRow = RuntimeSqlRow>(query: string, ...bindings: RuntimeSqlValue[]) {
                return storage.sql.exec<T>(query, ...bindings)
              },
              logicalRowsWritten(): number {
                const row = storage.sql.exec<{ logical_rows_written: number }>(
                  'SELECT changes() AS logical_rows_written',
                ).toArray()[0]
                return Number(row?.logical_rows_written ?? 0)
              },
              transactionSync<T>(callback: () => T): T {
          """
          if marker not in durable:
              raise SystemExit('durable executor marker missing')
          durable_path.write_text(durable.replace(marker, replacement))

          adapter_path = Path('tests/native-sharing-cloudflare/sqlite-test-adapter.ts')
          adapter = adapter_path.read_text()
          marker = """  transactionSync<T>(callback: () => T): T {
              return this.database.transaction(callback)()
            }
          """
          replacement = """  logicalRowsWritten(): number {
              const row = this.database.query(
                'SELECT changes() AS logical_rows_written',
              ).get() as { logical_rows_written: number }
              return Number(row.logical_rows_written)
            }

            transactionSync<T>(callback: () => T): T {
              return this.database.transaction(callback)()
            }
          """
          if marker not in adapter:
              raise SystemExit('Bun executor marker missing')
          adapter_path.write_text(adapter.replace(marker, replacement))

          workerd_path = Path('tests/native-sharing-cloudflare/workerd-atomicity.test.ts')
          workerd = workerd_path.read_text().replace(
              "test('EXPORTS_CONFIG_LOADS and SQLITE_SCHEMA_EXISTS'",
              "test('WORKERD_SQLITE_SCHEMA_EXISTS'",
          )
          workerd_path.write_text(workerd)

          config_path = Path('native-sharing-cloudflare/vitest.config.mts')
          config = config_path.read_text().replace(
              "include: ['tests/native-sharing-cloudflare/workerd-*.test.ts']",
              "include: ['tests/native-sharing-cloudflare/workerd-atomicity.test.ts']",
          )
          config_path.write_text(config)
          PY
          rm -f tests/native-sharing-cloudflare/workerd-rows-written-diagnostic.test.ts
          rm -f .github/workflows/native-sharing-cloudflare-vitest-diagnostic.yml
          rm -f .github/workflows/native-sharing-cloudflare-logical-rows-fix.yml
          git diff --check
      - name: Verify Bun adapter
        run: bun test tests/native-sharing-cloudflare/runtime.test.ts
      - name: Verify workerd SQLite proof
        run: bun run test:native-sharing-cloudflare:vitest -- --reporter=verbose
      - name: Commit clean correction
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name 'stracker-ci'
          git config user.email 'stracker-ci@users.noreply.github.com'
          git add -A
          git commit -m 'fix: verify logical SQLite row changes across adapters'
          git push origin "HEAD:$HEAD_BRANCH"
