name: STRACKER Vector Map Engine V1

on:
  pull_request:
    branches:
      - feat/stracker-cloudflare-private-gateway-poc
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: stracker-vector-map-engine-v1-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  candidate-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify exact stacked base
        run: |
          test "$(git merge-base HEAD origin/feat/stracker-cloudflare-private-gateway-poc)" = "77a937b4b157c2ec2c47940d6fe6891cf10b74c9"
          git diff --check origin/feat/stracker-cloudflare-private-gateway-poc...HEAD
          echo 'STACKED_BASE_CHECK=PASS'
      - name: Generate lockfile candidate
        run: |
          bun install
          git diff -- bun.lock > /tmp/bun-lock.patch
      - uses: actions/upload-artifact@v4
        with:
          name: vector-map-lock-${{ github.event.pull_request.head.sha }}
          path: |
            bun.lock
            /tmp/bun-lock.patch
          retention-days: 2
      - name: Python dependencies and backend gates
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m py_compile tracker_map.py nextjs-ui/tracker_map.py stracker_security.py stracker_session.py
          python -m unittest discover -s tests -p 'test_*.py'
          cmp tracker_map.py nextjs-ui/tracker_map.py
      - name: ESLint
        run: bun run lint
      - name: Typecheck
        run: bun run typecheck
      - name: Vector map pure tests
        run: bun run test:vector-map
      - name: Static export build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: bun run build:export
      - name: Preliminary single-engine gate
        run: |
          test -f out/index.html
          ! grep -R --binary-files=without-match -nE 'mapbox-gl|api\.mapbox\.com|pk\.[A-Za-z0-9]' out
          ! grep -R --binary-files=without-match -nE 'react-leaflet|leaflet-container|tile\.openstreetmap\.org|server\.arcgisonline\.com' out
          grep -R --binary-files=without-match -q 'maplibre' out/_next/static
          ! grep -R --binary-files=without-match -n 'stracker.lastSelectedSource' out
          echo 'PRELIMINARY_SINGLE_ENGINE=PASS'
