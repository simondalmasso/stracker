name: STRACKER Vector Map Engine V1

on:
  pull_request:
    branches:
      - feat/stracker-cloudflare-private-gateway-poc
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: stracker-vector-map-engine-v1-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  candidate-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify exact stacked base
        run: |
          test "$(git merge-base HEAD origin/feat/stracker-cloudflare-private-gateway-poc)" = "77a937b4b157c2ec2c47940d6fe6891cf10b74c9"
          git diff --check origin/feat/stracker-cloudflare-private-gateway-poc...HEAD
          echo 'STACKED_BASE_CHECK=PASS'
      - name: Materialize lockfile candidate
        run: |
          bun install
          if ! git diff --quiet -- bun.lock; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add bun.lock
            git commit -m 'chore: freeze MapLibre-only lockfile'
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
      - name: Python dependencies and backend gates
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m py_compile tracker_map.py nextjs-ui/tracker_map.py stracker_security.py stracker_session.py
          python -m unittest discover -s tests -p 'test_*.py'
          cmp tracker_map.py nextjs-ui/tracker_map.py
      - name: ESLint diagnostic
        continue-on-error: true
        run: |
          set -o pipefail
          bun run lint 2>&1 | tee /tmp/eslint.log
      - name: Typecheck diagnostic
        continue-on-error: true
        run: |
          set -o pipefail
          bun run typecheck 2>&1 | tee /tmp/typecheck.log
      - name: Vector map pure tests diagnostic
        continue-on-error: true
        run: |
          set -o pipefail
          bun run test:vector-map 2>&1 | tee /tmp/vector-tests.log
      - name: Static export diagnostic
        continue-on-error: true
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: |
          set -o pipefail
          bun run build:export 2>&1 | tee /tmp/build.log
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vector-map-diagnostics-${{ github.event.pull_request.head.sha }}
          path: |
            /tmp/eslint.log
            /tmp/typecheck.log
            /tmp/vector-tests.log
            /tmp/build.log
          if-no-files-found: warn
          retention-days: 2
      - name: Enforce candidate gates
        run: |
          bun run lint
          bun run typecheck
          bun run test:vector-map
          test -f out/index.html
          ! grep -R --binary-files=without-match -nE 'mapbox-gl|api\.mapbox\.com|pk\.[A-Za-z0-9]' out
          ! grep -R --binary-files=without-match -nE 'react-leaflet|leaflet-container|tile\.openstreetmap\.org|server\.arcgisonline\.com' out
          grep -R --binary-files=without-match -q 'maplibre' out/_next/static
          ! grep -R --binary-files=without-match -n 'stracker.lastSelectedSource' out
          echo 'PRELIMINARY_SINGLE_ENGINE=PASS'
