name: STRACKER Vector Map Engine V1

on:
  pull_request:
    branches:
      - feat/stracker-cloudflare-private-gateway-poc
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: stracker-vector-map-engine-v1-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  local-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: STACKED_BASE_CHECK
        run: |
          test "$(git merge-base HEAD origin/feat/stracker-cloudflare-private-gateway-poc)" = "77a937b4b157c2ec2c47940d6fe6891cf10b74c9"
          git diff --check origin/feat/stracker-cloudflare-private-gateway-poc...HEAD
          echo 'STACKED_BASE_CHECK=PASS'
      - name: FROZEN_INSTALL
        run: |
          bun install --frozen-lockfile
          git diff --exit-code -- package.json bun.lock
          echo 'FROZEN_INSTALL=PASS'
      - name: BACKEND_TESTS
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m py_compile tracker_map.py nextjs-ui/tracker_map.py stracker_security.py stracker_session.py
          python -m unittest discover -s tests -p 'test_*.py'
          cmp tracker_map.py nextjs-ui/tracker_map.py
          echo 'BACKEND_TESTS=PASS'
      - name: ESLINT
        run: |
          bun run lint
          echo 'ESLINT=PASS'
      - name: TYPECHECK
        run: |
          bun run typecheck
          echo 'TYPECHECK=PASS'
      - name: VECTOR_MAP_PURE_TESTS
        run: |
          bun run test:vector-map
          node --check tests/mobile_qa.mjs
          node --check tests/vector_map_extended_qa.mjs
          node --check tests/vector_map_performance_gate.mjs
          node --check tools/map-spike/run-benchmark.mjs
          node --check tools/map-spike/validate-openfreemap-live.mjs
          node --check tools/map-spike/prepare-artifact.mjs
          echo 'VECTOR_MAP_TESTS=PASS'
      - name: STATIC_EXPORT_BUILD
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: |
          bun run build:export
          test -f out/index.html
          echo 'BUILD=PASS'
      - name: RELEASE_DEPENDENCY_GATE
        run: |
          node - <<'NODE'
          const pkg = require('./package.json')
          const all = {...pkg.dependencies, ...pkg.devDependencies}
          for (const loser of ['mapbox-gl', 'leaflet', 'react-leaflet', '@types/leaflet']) {
            if (loser in all) throw new Error(`losing engine dependency remains: ${loser}`)
          }
          if (!('maplibre-gl' in all)) throw new Error('maplibre-gl dependency missing')
          NODE
          ! grep -nE '"(leaflet|react-leaflet|@types/leaflet|mapbox-gl)"' bun.lock
          echo 'ZERO_COST_HARD_GATE=PASS'
          echo 'PAID_OVERAGE_RISK=NO'
          echo 'FINAL_BUNDLE_SINGLE_ENGINE=PASS'
      - name: RELEASE_SOURCE_GATE
        run: |
          ! grep -R --binary-files=without-match -nE "from ['\"](leaflet|react-leaflet|mapbox-gl)['\"]|mapboxgl|api\.mapbox\.com|pk\.[A-Za-z0-9]" src/components/mobile src/lib/location-source src/app package.json
          grep -R --binary-files=without-match -q 'tiles.openfreemap.org/styles/liberty' src/lib/location-source
          ! grep -R --binary-files=without-match -n 'stracker.lastSelectedSource' src out
          ! grep -R --binary-files=without-match -nE 'FreshnessState.*dead|["'"']dead["'"']' src/lib/location-source
          echo 'UNSELECTED_ENGINE_ABSENT=PASS'
      - name: EXPORT_BUNDLE_GATE
        run: |
          ! grep -R --binary-files=without-match -nE 'api\.mapbox\.com|mapbox-gl|leaflet-container|tile\.openstreetmap\.org|server\.arcgisonline\.com' out
          grep -R --binary-files=without-match -q 'tiles.openfreemap.org/styles/liberty' out/_next/static
          ! grep -R --binary-files=without-match -nE 'STRACKER_SERVICE_TOKEN|X-Stracker-Service-Token|CF_Authorization|SAPISID=|Authorization: Bearer' out
          echo 'SINGLE_ENGINE_FINAL_BUNDLE=PASS'
          echo 'SENSITIVE_DATA_IN_LOGS=NO'
          echo 'SENSITIVE_DATA_IN_ARTIFACTS=NO'

  mobile-browser-qa:
    needs: local-gates
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      artifact-digest: ${{ steps.upload.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4
      - name: FROZEN_INSTALL
        run: bun install --frozen-lockfile
      - name: STATIC_EXPORT_BUILD
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: bun run build:export
      - name: MOBILE_BROWSER_QA
        env:
          QA_RAW_OUTPUT: /tmp/mobile-results.json
          QA_EXTENDED_OUTPUT: /tmp/mobile-extended-results.json
          QA_PERFORMANCE_OUTPUT: /tmp/mobile-performance-results.json
        run: |
          python -m http.server 4173 --directory out >/tmp/stracker-vector-map-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4173/ >/dev/null
          node tests/mobile_qa.mjs
          node tests/vector_map_extended_qa.mjs
          node tests/vector_map_performance_gate.mjs
          echo 'MOBILE_QA=PASS'
      - name: PERFORMANCE_BUDGET_GATE
        run: |
          jq -e '.engine == "maplibre" and .provider == "openfreemap-openstreetmap" and (.viewports | length == 5) and .physicalDevice == "NOT_EXECUTED_ENV_BLOCKED"' /tmp/mobile-results.json >/dev/null
          jq -e '[.viewports[] | select(.pageErrors != 0 or .consoleErrors != 0)] | length == 0' /tmp/mobile-results.json >/dev/null
          jq -e '.gates.NO_UNBOUNDED_MEMORY_GROWTH == "PASS" and .gates.SHARED_POLLING_NO_INTERPOLATION == "PASS" and .gates.PROVIDER_FAILURE_DEGRADES_HONESTLY == "PASS" and .gates.REDUCED_MOTION == "PASS"' /tmp/mobile-extended-results.json >/dev/null
          jq -e '.gates.PERFORMANCE_BUDGETS == "PASS"' /tmp/mobile-performance-results.json >/dev/null
          echo 'PERFORMANCE_BUDGETS=PASS'
          echo 'PHYSICAL_DEVICE_EVIDENCE_HONEST=PASS'
      - name: SECURITY_ARTIFACT_SCAN
        env:
          ARTIFACT_KIND: mobile-qa
          ARTIFACT_DIR: /tmp/stracker-vector-map-mobile-qa-${{ github.event.pull_request.head.sha }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          SOURCE_FILES_JSON: '["/tmp/mobile-results.json","/tmp/mobile-extended-results.json","/tmp/mobile-performance-results.json"]'
          COMMANDS_JSON: '["bun install --frozen-lockfile","bun run build:export","node tests/mobile_qa.mjs","node tests/vector_map_extended_qa.mjs","node tests/vector_map_performance_gate.mjs"]'
          GATES_JSON: '{"MOBILE_BROWSER_QA":"PASS","PERFORMANCE_BUDGET_GATE":"PASS","SECURITY_ARTIFACT_SCAN":"PASS","A22_PHYSICAL_VALIDATION":"NOT_EXECUTED_ENV_BLOCKED"}'
        run: node tools/map-spike/prepare-artifact.mjs
      - name: Upload current-head mobile QA artifact
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: stracker-vector-map-mobile-qa-${{ github.event.pull_request.head.sha }}
          path: /tmp/stracker-vector-map-mobile-qa-${{ github.event.pull_request.head.sha }}/
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 14
      - name: Verify mobile artifact upload
        run: |
          test -n '${{ steps.upload.outputs.artifact-id }}'
          test -n '${{ steps.upload.outputs.artifact-digest }}'
          echo 'MOBILE_ARTIFACT_CURRENT_HEAD=PASS'

  renderer-and-provider-validation:
    needs: local-gates
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      artifact-digest: ${{ steps.upload.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4
      - name: FROZEN_INSTALL
        run: bun install --frozen-lockfile
      - name: Install benchmark-only Mapbox outside repository
        run: |
          mkdir -p /tmp/stracker-mapbox-benchmark
          npm install --prefix /tmp/stracker-mapbox-benchmark --ignore-scripts --no-audit --no-fund 'mapbox-gl@3.26.0'
          test ! -e node_modules/mapbox-gl
          test ! -e package-lock.json
      - name: RENDERER_BENCHMARK
        env:
          MAPBOX_BENCHMARK_ROOT: /tmp/stracker-mapbox-benchmark
          MAP_SPIKE_OUTPUT: /tmp/renderer-results.json
        run: |
          node tools/map-spike/run-benchmark.mjs
          jq -e '.benchmarkClassification == "RENDERER_BENCHMARK_ONLY" and .fullStackParityClaimed == false and .dataProvider == "LOCAL_SYNTHETIC_GEOJSON_ONLY" and (.engines | length == 2)' /tmp/renderer-results.json >/dev/null
          jq -e '[.engines[] | select(.webgl != true or .buildings3d != true or (.externalHosts | length) != 0 or .consoleErrorCount != 0)] | length == 0' /tmp/renderer-results.json >/dev/null
          echo 'RENDERER_BENCHMARK=PASS'
      - name: OPENFREEMAP_LIVE_VALIDATION
        env:
          OPENFREEMAP_LIVE_OUTPUT: /tmp/openfreemap-live-results.json
        run: |
          node tools/map-spike/validate-openfreemap-live.mjs
          jq -e '.fixture.classification == "PUBLIC_GENERIC_NON_PRIVATE" and .fixture.coordinateValuesRetained == false and .gates.STYLE_ACCESSIBLE == "PASS" and .gates.TILES_ACCESSIBLE == "PASS" and .gates.SANTA_FE_STREETS_PRESENT == "PASS" and .gates.BUILDING_FOOTPRINTS_PRESENT == "PASS" and .gates.BUILDING_HEIGHTS_AVAILABLE_WHERE_PRESENT == "PASS" and .vectorTiles.completeCoverageClaimed == false and .vectorTiles.completeHeightCoverageClaimed == false' /tmp/openfreemap-live-results.json >/dev/null
          echo 'OPENFREEMAP_LIVE_VALIDATION=PASS'
      - name: RELEASE_ABSENCE_RECHECK
        run: |
          test ! -e node_modules/mapbox-gl
          ! grep -n 'mapbox-gl' package.json bun.lock
          echo 'UNSELECTED_ENGINE_ABSENT=PASS'
      - name: SECURITY_ARTIFACT_SCAN
        env:
          ARTIFACT_KIND: renderer-spike
          ARTIFACT_DIR: /tmp/stracker-vector-map-spike-${{ github.event.pull_request.head.sha }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          SOURCE_FILES_JSON: '["/tmp/renderer-results.json","/tmp/openfreemap-live-results.json"]'
          COMMANDS_JSON: '["bun install --frozen-lockfile","npm install --prefix /tmp/stracker-mapbox-benchmark mapbox-gl@3.26.0","node tools/map-spike/run-benchmark.mjs","node tools/map-spike/validate-openfreemap-live.mjs"]'
          GATES_JSON: '{"RENDERER_BENCHMARK":"PASS","FULL_STACK_PARITY_CLAIMED":"NO","OPENFREEMAP_LIVE_VALIDATION":"PASS","ZERO_COST_HARD_GATE":"PASS","UNSELECTED_ENGINE_ABSENT":"PASS","SECURITY_ARTIFACT_SCAN":"PASS"}'
        run: node tools/map-spike/prepare-artifact.mjs
      - name: Upload current-head renderer and provider artifact
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: stracker-vector-map-spike-${{ github.event.pull_request.head.sha }}
          path: /tmp/stracker-vector-map-spike-${{ github.event.pull_request.head.sha }}/
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 14
      - name: Verify renderer artifact upload
        run: |
          test -n '${{ steps.upload.outputs.artifact-id }}'
          test -n '${{ steps.upload.outputs.artifact-digest }}'
          echo 'SPIKE_ARTIFACT_CURRENT_HEAD=PASS'

  final-integrity:
    needs: [local-gates, mobile-browser-qa, renderer-and-provider-validation]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: FINAL_INTEGRITY
        run: |
          test "$(git rev-parse HEAD)" = '${{ github.event.pull_request.head.sha }}'
          git diff --check
          test ! -e .github/workflows/vector-map-snapshot.yml
          test ! -e .github/workflows/vector-map-lint-diagnostic.yml
          ! grep -R --include='*.yml' --include='*.yaml' -n 'contents: write' .github/workflows
          test -n '${{ needs.mobile-browser-qa.outputs.artifact-id }}'
          test -n '${{ needs.mobile-browser-qa.outputs.artifact-digest }}'
          test -n '${{ needs.renderer-and-provider-validation.outputs.artifact-id }}'
          test -n '${{ needs.renderer-and-provider-validation.outputs.artifact-digest }}'
          echo 'TEMPORARY_WORKFLOWS_REMOVED=PASS'
          echo 'ARTIFACTS_CURRENT_HEAD=PASS'
          echo 'PRODUCTION_MODIFIED=NO'
          echo 'DEPLOY=NO'
          echo 'MERGE=NO'
          echo 'CI_FINAL=SUCCESS'
