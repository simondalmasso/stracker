name: STRACKER Mobile Product Implement

on:
  pull_request:
    branches:
      - fix/stracker-p0-security-canonical-state
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: stracker-mobile-product-implement
  cancel-in-progress: false

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      STRACKER_ENV: test
      STRACKER_API_TOKEN: test-service-token-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
      SECRET_KEY: test-secret-key-ssssssssssssssssssssssssssssssssssssssssssssssss
      TRACKER_SKIP_PLAYWRIGHT: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/stracker-mobile-session-product-v1
          fetch-depth: 0
          persist-credentials: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify exact stacked base
        run: |
          git fetch origin fix/stracker-p0-security-canonical-state
          test "$(git merge-base HEAD origin/fix/stracker-p0-security-canonical-state)" = "fa919edad57937481f97e74ac96f09697bf03642"
      - name: Apply deterministic integration
        run: python scripts/apply_mobile_product_v1.py
      - name: Install frozen dependencies
        run: bun install --frozen-lockfile
      - name: Python syntax and backend tests
        run: |
          python -m py_compile tracker_map.py nextjs-ui/tracker_map.py stracker_security.py stracker_session.py
          python -m unittest discover -s tests -p 'test_*.py'
          cmp tracker_map.py nextjs-ui/tracker_map.py
      - name: Frontend gates
        run: |
          bun run lint
          bun run typecheck
          BUILD_EXPORT=1 bun run build
      - name: Validate generated tree
        run: |
          git diff --check
          test ! -e .env
          test -f out/index.html
          ! grep -R --exclude='*.map' --exclude='bun.lock' -n 'STRACKER_API_TOKEN\|test-service-token' out src || false
      - name: Commit implementation
        run: |
          rm -f .github/workflows/mobile-product-implement.yml scripts/apply_mobile_product_v1.py
          git add -A
          if git diff --cached --quiet; then
            echo 'No generated changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: implement mobile location source product v1'
          git push origin HEAD:feat/stracker-mobile-session-product-v1
