name: STRACKER dependency refresh preview (temporary)

on:
  pull_request:
    branches:
      - feat/stracker-native-sharing-live-synthetic-v1
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  refresh-preview:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/stracker-controlled-physical-pilot-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4
      - name: Refresh patched dependency graph and emit reviewable result
        shell: bash
        run: |
          set -uo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          p.dependencies['maplibre-gl'] = '^6.14.0';
          p.dependencies['sharp'] = '^0.35.4';
          p.devDependencies = p.devDependencies || {};
          delete p.devDependencies['eslint-config-next'];
          p.devDependencies['typescript-eslint'] = '^8.46.2';
          p.devDependencies['eslint-plugin-react-hooks'] = '^7.0.1';
          p.overrides = { ...(p.overrides || {}), 'deepmerge-ts': '8.0.2', 'brace-expansion': '1.1.19', 'sharp': '0.35.4', 'undici': '7.29.1', 'source-map-js': '1.2.2', 'browserslist': '4.28.7' };
          delete p.overrides.braces;
          fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
          fs.writeFileSync('eslint.config.mjs', `import { defineConfig, globalIgnores } from "eslint/config";
          import tseslint from "typescript-eslint";
          import reactHooks from "eslint-plugin-react-hooks";

          export default defineConfig([
            ...tseslint.configs.recommended,
            reactHooks.configs.flat.recommended,
            globalIgnores([".next/**", "out/**", "nextjs-ui/**", "skills/**", "tool-results/**", "src/components/tracker/**", "scripts/release/minimum-runtime-qa.ts"]),
          ]);
          `);
          NODE
          if bun update; then
            echo 'BUN_UPDATE=PASS'
          else
            rc=$?
            echo "BUN_UPDATE=FAIL:$rc"
            exit "$rc"
          fi
          check() {
            label="$1"
            shift
            if "$@"; then
              echo "${label}=PASS"
            else
              rc=$?
              echo "${label}=FAIL:$rc"
            fi
          }
          check DEPENDENCY_AUDIT bun audit --audit-level high
          check TYPECHECK bun run typecheck
          check LINT bun run lint
          check VECTOR_MAP_TESTS bun run test:vector-map
          check BUILD bun run build
          node <<'NODE'
          const fs = require('node:fs');
          function emit(file, label) {
            const b64 = fs.readFileSync(file).toString('base64');
            console.log(`@@${label}_B64_BEGIN@@`);
            let index = 0;
            for (let offset = 0; offset < b64.length; offset += 8000) {
              console.log(`${label}_B64_CHUNK_${String(index++).padStart(4, '0')}=${b64.slice(offset, offset + 8000)}`);
            }
            console.log(`@@${label}_B64_END@@`);
          }
          emit('package.json', 'PACKAGE');
          emit('bun.lock', 'LOCK');
          emit('eslint.config.mjs', 'ESLINT_CONFIG');
          NODE
