name: STRACKER Native Sharing Vector Diagnostic

on:
  pull_request:
    branches:
      - feat/stracker-vector-map-engine-v1
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4
      - run: bun install --frozen-lockfile
      - name: Capture vector output
        run: |
          set +e
          bun run test:vector-map >/tmp/vector-tests.txt 2>&1
          echo $? >/tmp/vector-tests-exit.txt
          node tools/map-spike/release-source-gate.mjs >/tmp/vector-source-gate.txt 2>&1
          echo $? >/tmp/vector-source-gate-exit.txt
          grep -R -n 'google-shared' tests/vector-map src/lib/location-source >/tmp/vector-legacy.txt 2>&1
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: native-sharing-vector-diagnostic-${{ github.event.pull_request.head.sha }}
          path: /tmp/vector-*.txt
          if-no-files-found: error
          retention-days: 1
