name: STRACKER Cookie Verifier Fix

on:
  push:
    branches:
      - feat/stracker-controlled-physical-pilot-v1
    paths:
      - .github/workflows/stracker-cookie-verifier-fix.yml

permissions:
  contents: write

jobs:
  apply-exact-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/stracker-controlled-physical-pilot-v1
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4
      - name: APPLY_AND_VERIFY
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('native-sharing-cloudflare/src/cookie-session.ts')
          source = path.read_text()
          old = "!TOKEN.test(input.sessionId) || !/^[0-9a-f]{64}$/.test(input.ownerVerifier)"
          new = "!TOKEN.test(input.sessionId) || !TOKEN.test(input.ownerVerifier)"
          if source.count(old) != 1:
              raise SystemExit('OWNER_VERIFIER_PATTERN_NOT_EXACT')
          path.write_text(source.replace(old, new))
          PY
          bun install --frozen-lockfile
          bun test tests/native-sharing/native-sharing.test.ts tests/native-sharing/pilot-runtime.test.ts
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add native-sharing-cloudflare/src/cookie-session.ts
          git commit -m 'fix: accept native cookie owner verifier encoding'
          git push origin HEAD:feat/stracker-controlled-physical-pilot-v1
