name: STRACKER Native Sharing Cloudflare Bun Adapter Diagnostic

on:
  pull_request:
    branches:
      - feat/stracker-native-location-sharing-v1
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4
      - name: Frozen install
        run: bun install --frozen-lockfile
      - name: Run exact Bun adapter command
        id: bun_adapter
        shell: bash
        run: |
          set +e
          set -o pipefail
          bun test tests/native-sharing-cloudflare/runtime.test.ts 2>&1 \
            | tee /tmp/native-sharing-cloudflare-bun-adapter.log
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-sharing-cloudflare-bun-adapter-${{ github.event.pull_request.head.sha }}
          path: /tmp/native-sharing-cloudflare-bun-adapter.log
          if-no-files-found: error
          retention-days: 1
      - name: Preserve Bun adapter exit code
        if: always()
        run: exit '${{ steps.bun_adapter.outputs.exit_code }}'
