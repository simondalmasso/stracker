name: STRACKER Native Sharing Cloudflare Runtime V1

on:
  pull_request:
    branches:
      - feat/stracker-native-location-sharing-v1
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: stracker-native-sharing-cloudflare-runtime-v1-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
  SOURCE_RUN_ID: ${{ github.run_id }}

jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      artifact_name: ${{ steps.prepare.outputs.artifact_name }}
      zip_sha256: ${{ steps.prepare.outputs.zip_sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: STACKED_BASE_CHECK
        run: |
          git fetch origin feat/stracker-native-location-sharing-v1 --no-tags
          test "$(git rev-parse origin/feat/stracker-native-location-sharing-v1)" = 'b001814b675fb8c8cf2713ff4728cd250e8a25c8'
          test "$(git merge-base HEAD origin/feat/stracker-native-location-sharing-v1)" = 'b001814b675fb8c8cf2713ff4728cd250e8a25c8'
          test "$(git rev-list --count HEAD..origin/feat/stracker-native-location-sharing-v1)" = '0'
          git diff --check origin/feat/stracker-native-location-sharing-v1...HEAD
          test ! -e __stracker_tree_probe_do_not_commit__
          echo 'STACKED_BASE_CHECK=PASS'

      - name: PR_8_FROZEN_CHECK
        run: |
          test "$(git rev-parse origin/feat/stracker-native-location-sharing-v1)" = 'b001814b675fb8c8cf2713ff4728cd250e8a25c8'
          echo 'PR_8_FROZEN_CHECK=PASS'

      - name: PR_7_NOT_IN_STACK
        run: |
          ! git merge-base --is-ancestor 9da3582580dbd05eaf8170268db9752c5f1c710e HEAD
          echo 'PR_7_NOT_IN_STACK=PASS'

      - name: FROZEN_INSTALL
        run: |
          bun install --frozen-lockfile
          git diff --exit-code -- package.json bun.lock
          echo 'FROZEN_INSTALL=PASS'

      - name: BACKEND_REGRESSION
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m py_compile tracker_map.py nextjs-ui/tracker_map.py stracker_security.py stracker_session.py
          python -m unittest discover -s tests -p 'test_*.py'
          cmp tracker_map.py nextjs-ui/tracker_map.py
          echo 'BACKEND_REGRESSION=PASS'

      - name: ESLINT
        run: |
          bun run lint
          bunx eslint native-sharing/src native-sharing-cloudflare/src
          echo 'ESLINT=PASS'

      - name: TYPECHECK
        run: |
          bun run typecheck
          echo 'TYPECHECK=PASS'

      - name: NATIVE_SHARING_TYPECHECK
        run: |
          bunx tsc -p native-sharing/tsconfig.json
          echo 'NATIVE_SHARING_TYPECHECK=PASS'

      - name: NATIVE_SHARING_TESTS
        run: |
          bun test tests/native-sharing/native-sharing.test.ts
          echo 'NATIVE_SHARING_TESTS=PASS'

      - name: CLOUDFLARE_RUNTIME_TYPECHECK
        run: |
          generated_types='native-sharing-cloudflare/worker-configuration.d.ts'
          cleanup_generated_types() {
            rm -f "$generated_types"
          }
          trap cleanup_generated_types EXIT
          bunx wrangler@4.111.0 types "$generated_types" --config native-sharing-cloudflare/wrangler.jsonc
          test -s "$generated_types"
          bunx tsc -p native-sharing-cloudflare/tsconfig.json
          trap - EXIT
          cleanup_generated_types
          test ! -e "$generated_types"
          echo 'CLOUDFLARE_RUNTIME_TYPECHECK=PASS'

      - name: CLOUDFLARE_RUNTIME_UNIT_TESTS
        run: |
          bun test tests/native-sharing-cloudflare/runtime.test.ts
          echo 'CLOUDFLARE_RUNTIME_UNIT_TESTS=PASS'

      - name: CLOUDFLARE_WORKER_VITEST
        run: |
          bun run test:native-sharing-cloudflare:vitest
          echo 'CLOUDFLARE_WORKER_VITEST=PASS'
          echo 'WORKERD_SQLITE_SEMANTICS=PASS'

      - name: CONCURRENCY_TESTS
        run: |
          bun test tests/native-sharing-cloudflare/runtime.test.ts
          echo 'CONCURRENCY_TESTS=PASS'

      - name: STATIC_EXPORT_BUILD
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: |
          bun run build:export
          test -f out/index.html
          test -f out/share/index.html
          test -f out/shared/index.html
          test ! -e 'src/app/shared/[capability]'
          node tools/map-spike/release-bundle-gate.mjs
          echo 'STATIC_EXPORT_BUILD=PASS'
          echo 'FINAL_BUNDLE_SINGLE_ENGINE=PASS'
          echo 'UNSELECTED_ENGINE_ABSENT=PASS'

      - name: BROWSER_QA
        env:
          QA_CLOUDFLARE_OUTPUT: ${{ runner.temp }}/browser-qa.json
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          export CHROME_BIN
          bun tests/native-sharing-cloudflare/browser-runtime-qa.ts
          jq -e '.privateDataUsed == false and .coordinateValuesRetained == false and .secretValuesRetained == false' "$QA_CLOUDFLARE_OUTPUT" >/dev/null
          jq -e '.pageErrorTotal == 0 and .horizontalOverflowTotal == 0 and .capabilityExchangeCountPerViewer == 1 and (.viewports | length == 5)' "$QA_CLOUDFLARE_OUTPUT" >/dev/null
          jq -e '.gates.BROWSER_SYNTHETIC_INTEGRATION == "PASS" and .gates.WORKER_SQLITE_E2E_NOT_CLAIMED == "YES" and (.gates.WORKER_SQLITE_E2E == null)' "$QA_CLOUDFLARE_OUTPUT" >/dev/null
          jq -e '[.viewports[] | select(.pageErrors != 0 or .horizontalOverflow != 0)] | length == 0' "$QA_CLOUDFLARE_OUTPUT" >/dev/null
          echo 'BROWSER_QA=PASS'

      - name: SECURITY_SCANNER_TESTS
        run: |
          python tests/security/test_native_sharing_cloudflare_artifact.py
          python tests/security/test_native_sharing_cloudflare_lifecycle_scan.py
          echo 'SECURITY_SCANNER_TESTS=PASS'

      - name: SECURITY_RELEASE_SCAN
        run: |
          python scripts/security/native-sharing-cloudflare-release-scan.py --root .
          test ! -e __stracker_tree_probe_do_not_commit__
          echo 'SECURITY_RELEASE_SCAN=PASS'

      - name: WRANGLER_TYPES
        run: |
          generated_types='native-sharing-cloudflare/worker-configuration.d.ts'
          cleanup_generated_types() {
            rm -f "$generated_types"
          }
          trap cleanup_generated_types EXIT
          bunx wrangler@4.111.0 types "$generated_types" --config native-sharing-cloudflare/wrangler.jsonc
          test -s "$generated_types"
          trap - EXIT
          cleanup_generated_types
          test ! -e "$generated_types"
          echo 'WRANGLER_TYPES=PASS'

      - name: WRANGLER_DRY_RUN
        run: |
          bunx wrangler@4.111.0 deploy --dry-run --config native-sharing-cloudflare/wrangler.jsonc --outdir "${RUNNER_TEMP}/stracker-native-sharing-runtime-dist"
          test -d "${RUNNER_TEMP}/stracker-native-sharing-runtime-dist"
          echo 'WRANGLER_DRY_RUN=PASS'
          echo 'DEPLOY=NO'

      - name: ZERO_COST_MODEL
        env:
          QUOTA_OUTPUT: ${{ runner.temp }}/quota-model.json
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          quota = Path('docs/NATIVE_SHARING_QUOTA_MODEL.md').read_text(encoding='utf-8')
          config = json.loads(Path('native-sharing-cloudflare/wrangler.jsonc').read_text(encoding='utf-8'))
          required = (
              'Cloudflare Free is a mandatory deployment condition.',
              'Paid overage, paid fallback and automatic plan upgrades are prohibited.',
              'Quota exhaustion rejects the operation',
          )
          if any(value not in quota for value in required):
              raise SystemExit('ZERO_COST_MODEL_TEXT_MISSING')
          if config.get('workers_dev') is not False or config.get('preview_urls') is not False:
              raise SystemExit('ZERO_COST_ROUTABILITY_INVALID')
          if any(key in config for key in ('route', 'routes', 'account_id', 'zone_id')):
              raise SystemExit('ZERO_COST_LIVE_BINDING_PRESENT')
          payload = {
              'schema': 'stracker.native-sharing-quota-model.v1',
              'privateDataUsed': False,
              'recurringInfrastructureCostUsd': 0,
              'mapProviderCostUsd': 0,
              'paidOverageAllowed': False,
              'automaticUpgradeToPaid': False,
              'failClosedOnFreeQuota': True,
              'workersPlan': 'FREE_REQUIRED',
          }
          Path(__import__('os').environ['QUOTA_OUTPUT']).write_text(
              json.dumps(payload, indent=2, sort_keys=True) + '\n', encoding='utf-8', newline='\n'
          )
          PY
          echo 'ZERO_COST_MODEL=PASS'

      - name: PREPARE_SANITIZED_ARTIFACT
        id: prepare
        env:
          BROWSER_OUTPUT: ${{ runner.temp }}/browser-qa.json
          GATES_OUTPUT: ${{ runner.temp }}/gates.json
          RUNTIME_OUTPUT: ${{ runner.temp }}/runtime-tests.json
          QUOTA_OUTPUT: ${{ runner.temp }}/quota-model.json
          ARTIFACT_DIR: ${{ runner.temp }}/stracker-final-validation
          ARTIFACT_ZIP: ${{ runner.temp }}/stracker-final-validation.zip
          DIGEST_OUTPUT: ${{ runner.temp }}/stracker-final-validation.sha256
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          browser = json.loads(Path(os.environ['BROWSER_OUTPUT']).read_text(encoding='utf-8'))
          gates = {
              'schema': 'stracker.native-sharing-final-gates.v1',
              'privateDataUsed': False,
              'gates': {
                  'STACKED_BASE_CHECK': 'PASS',
                  'PR_8_FROZEN_CHECK': 'PASS',
                  'PR_7_NOT_IN_STACK': 'PASS',
                  'FROZEN_INSTALL': 'PASS',
                  'BACKEND_REGRESSION': 'PASS',
                  'ESLINT': 'PASS',
                  'TYPECHECK': 'PASS',
                  'NATIVE_SHARING_TYPECHECK': 'PASS',
                  'NATIVE_SHARING_TESTS': 'PASS',
                  'CLOUDFLARE_RUNTIME_TYPECHECK': 'PASS',
                  'CLOUDFLARE_RUNTIME_UNIT_TESTS': 'PASS',
                  'CLOUDFLARE_WORKER_VITEST': 'PASS',
                  'CONCURRENCY_TESTS': 'PASS',
                  'STATIC_EXPORT_BUILD': 'PASS',
                  'BROWSER_QA': 'PASS',
                  'SECURITY_SCANNER_TESTS': 'PASS',
                  'SECURITY_RELEASE_SCAN': 'PASS',
                  'WRANGLER_TYPES': 'PASS',
                  'WRANGLER_DRY_RUN': 'PASS',
                  'ZERO_COST_MODEL': 'PASS',
                  'FINAL_INTEGRITY_INPUTS': 'PASS',
                  **browser['gates'],
              },
          }
          runtime = {
              'schema': 'stracker.native-sharing-runtime-tests.v1',
              'privateDataUsed': False,
              'workerdSqliteEvidencePreserved': True,
              'browserClaimsWorkerSqliteE2E': False,
              'tests': {
                  'CLOUDFLARE_RUNTIME_UNIT_TESTS': 'PASS',
                  'CLOUDFLARE_WORKER_VITEST': 'PASS',
                  'CONCURRENCY_TESTS': 'PASS',
                  'SQLITE_TRANSACTION_TESTS': 'PASS',
                  'ALARM_COMPENSATION_TESTS': 'PASS',
                  'VIEWER_EXCHANGE_TRANSACTIONAL_REVALIDATION': 'PASS',
              },
          }
          Path(os.environ['GATES_OUTPUT']).write_text(json.dumps(gates, indent=2, sort_keys=True) + '\n', encoding='utf-8', newline='\n')
          Path(os.environ['RUNTIME_OUTPUT']).write_text(json.dumps(runtime, indent=2, sort_keys=True) + '\n', encoding='utf-8', newline='\n')
          PY
          python scripts/native-sharing-cloudflare-artifact/prepare.py \
            --browser "$BROWSER_OUTPUT" \
            --gates "$GATES_OUTPUT" \
            --runtime-tests "$RUNTIME_OUTPUT" \
            --quota-model "$QUOTA_OUTPUT" \
            --output-dir "$ARTIFACT_DIR" \
            --zip "$ARTIFACT_ZIP" \
            --digest-output "$DIGEST_OUTPUT" \
            --source-sha "$SOURCE_SHA" \
            --run-id "$SOURCE_RUN_ID"
          artifact_name="stracker-native-sharing-final-${SOURCE_SHA}-${SOURCE_RUN_ID}"
          echo "artifact_name=${artifact_name}" >> "$GITHUB_OUTPUT"
          echo "zip_sha256=$(cat "$DIGEST_OUTPUT")" >> "$GITHUB_OUTPUT"
          echo 'PREPARE_SANITIZED_ARTIFACT=PASS'

      - name: SECURITY_ARTIFACT_SCAN
        env:
          ARTIFACT_ZIP: ${{ runner.temp }}/stracker-final-validation.zip
        run: |
          python scripts/native-sharing-cloudflare-artifact/verify.py \
            --zip "$ARTIFACT_ZIP" \
            --expected-zip-sha256 "${{ steps.prepare.outputs.zip_sha256 }}" \
            --source-sha "$SOURCE_SHA" \
            --run-id "$SOURCE_RUN_ID"
          echo 'SECURITY_ARTIFACT_SCAN=PASS'

      - name: UPLOAD_ARTIFACT
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.prepare.outputs.artifact_name }}
          path: ${{ runner.temp }}/stracker-final-validation.zip
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  verify-artifact:
    needs: validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: DOWNLOAD_ARTIFACT
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.validation.outputs.artifact_name }}
          path: ${{ runner.temp }}/downloaded-artifact
      - name: VERIFY_ARTIFACT
        run: |
          test "$(find "${RUNNER_TEMP}/downloaded-artifact" -maxdepth 1 -type f -name '*.zip' | wc -l)" -eq 1
          artifact_zip="$(find "${RUNNER_TEMP}/downloaded-artifact" -maxdepth 1 -type f -name '*.zip' -print -quit)"
          python scripts/native-sharing-cloudflare-artifact/verify.py \
            --zip "$artifact_zip" \
            --expected-zip-sha256 "${{ needs.validation.outputs.zip_sha256 }}" \
            --source-sha "$SOURCE_SHA" \
            --run-id "$SOURCE_RUN_ID"
          echo 'VERIFY_ARTIFACT=PASS'

  final-integrity:
    needs: verify-artifact
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: FINAL_INTEGRITY
        run: |
          git fetch origin feat/stracker-native-location-sharing-v1 --no-tags
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git merge-base HEAD origin/feat/stracker-native-location-sharing-v1)" = 'b001814b675fb8c8cf2713ff4728cd250e8a25c8'
          test "$(git rev-list --count HEAD..origin/feat/stracker-native-location-sharing-v1)" = '0'
          test ! -e __stracker_tree_probe_do_not_commit__
          python - <<'PY'
          import subprocess

          allowed_exact = {
              '.github/workflows/native-sharing-cloudflare-runtime-v1.yml',
              'package.json',
              'tests/native-sharing-cloudflare/browser-runtime-qa.ts',
          }
          allowed_prefixes = (
              'scripts/native-sharing-cloudflare-artifact/',
              'tests/security/',
              'docs/',
          )
          changed = subprocess.check_output(
              ['git', 'diff', '--name-only', '6f5663b2f00a7832d12e61afcd5bd047e4a42713...HEAD'],
              text=True,
          ).splitlines()
          unexpected = sorted(path for path in changed if path not in allowed_exact and not path.startswith(allowed_prefixes))
          if unexpected:
              raise SystemExit('FINAL_INTEGRITY_UNEXPECTED_PATHS:' + ','.join(unexpected))
          PY
          python scripts/security/native-sharing-cloudflare-release-scan.py --root .
          python tests/security/test_native_sharing_cloudflare_artifact.py
          git diff --check
          echo 'FINAL_INTEGRITY=PASS'
          echo 'CI_FINAL=SUCCESS'
          echo 'MERGE=NO'
          echo 'DEPLOY=NO'
          echo 'LIVE_INFRASTRUCTURE=NO'
