name: STRACKER Native Sharing Cloudflare Runtime V1

on:
  pull_request:
    branches:
      - feat/stracker-native-location-sharing-v1
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: stracker-native-sharing-cloudflare-runtime-v1-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  intermediate-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: STACKED_BASE_CHECK
        run: |
          git fetch origin feat/stracker-native-location-sharing-v1 --no-tags
          test "$(git rev-parse origin/feat/stracker-native-location-sharing-v1)" = 'b001814b675fb8c8cf2713ff4728cd250e8a25c8'
          test "$(git merge-base HEAD origin/feat/stracker-native-location-sharing-v1)" = 'b001814b675fb8c8cf2713ff4728cd250e8a25c8'
          test "$(git rev-list --count HEAD..origin/feat/stracker-native-location-sharing-v1)" = '0'
          git diff --check origin/feat/stracker-native-location-sharing-v1...HEAD
          test ! -e .github/workflows/native-sharing-cloudflare-lockgen.yml
          echo 'STACKED_BASE_CHECK=PASS'
          echo 'LOCKGEN_WORKFLOW_REMOVED=YES'

      - name: FROZEN_INSTALL
        run: |
          bun install --frozen-lockfile
          git diff --exit-code -- package.json bun.lock
          grep -q '"tw-animate-css": "\^1.3.5"' package.json
          echo 'FROZEN_INSTALL=PASS'
          echo 'PACKAGE_LOCK_SYNCHRONIZED=YES'

      - name: WRANGLER_TYPES
        run: |
          bunx wrangler@4.111.0 types native-sharing-cloudflare/worker-configuration.d.ts --config native-sharing-cloudflare/wrangler.jsonc
          test -s native-sharing-cloudflare/worker-configuration.d.ts
          echo 'WRANGLER_TYPES=PASS'

      - name: TYPECHECK
        run: |
          bun run typecheck
          bunx tsc -p native-sharing/tsconfig.json
          bunx tsc -p native-sharing-cloudflare/tsconfig.json
          echo 'TYPECHECK=PASS'

      - name: LINT
        run: |
          bun run lint
          bunx eslint native-sharing-cloudflare/src
          echo 'LINT=PASS'

      - name: BUN_ADAPTER_TESTS
        run: |
          bun test tests/native-sharing-cloudflare/runtime.test.ts
          echo 'BUN_ADAPTER_TESTS=PASS'

      - name: CLOUDFLARE_WORKER_VITEST
        run: |
          bun run test:native-sharing-cloudflare:vitest
          echo 'CLOUDFLARE_WORKER_VITEST=PASS'
          echo 'SQLITE_TRANSACTION_TESTS=PASS'
          echo 'ALARM_COMPENSATION_TESTS=PASS'
          echo 'VIEWER_EXCHANGE_TRANSACTIONAL_REVALIDATION=PASS'
          echo 'WORKERD_ATOMICITY_TESTS=PASS'

      - name: LIFECYCLE_SCANNER_FIXTURES
        run: |
          python tests/security/test_native_sharing_cloudflare_lifecycle_scan.py
          echo 'LIFECYCLE_SCANNER_FIXTURES=PASS'

      - name: RUNTIME_SECURITY_SCAN
        run: |
          python scripts/security/native-sharing-cloudflare-release-scan.py --root .
          echo 'RUNTIME_SECURITY_SCAN=PASS'
          echo 'EXPORTS_SQLITE=PASS'
          echo 'MIGRATIONS=ABSENT'

      - name: WRANGLER_DRY_RUN
        run: |
          bunx wrangler@4.111.0 deploy --dry-run --config native-sharing-cloudflare/wrangler.jsonc --outdir /tmp/stracker-native-sharing-runtime-dist
          test -d /tmp/stracker-native-sharing-runtime-dist
          echo 'WRANGLER_DRY_RUN=PASS'
          echo 'DEPLOY=NO'

      - name: STATE_TRUTH_CORRECTION
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('docs/CURRENT_STATE.md').read_text(encoding='utf-8')
          required = {
              'LEGACY_BASELINE_SHA=1b8bc4b79c63e36f5f6d7bb8a7fc39f0a782c930',
              'LEGACY_BASELINE_RUN=29974437874',
              'LEGACY_BASELINE_ARTIFACT=8550899250',
              'LEGACY_GREEN_SCOPE=SUPERSEDED_CONTRACT_ONLY',
              'PR_9_TECHNICALLY_READY=NO',
              'FINAL_ARTIFACT=NO',
              'CURRENT_REWORK=EXPORTS_SQLITE_ATOMICITY_WORKERD',
          }
          missing = sorted(required.difference(text.splitlines()))
          if missing:
              raise SystemExit('STATE_TRUTH_MISSING')
          forbidden = ('new_sqlite_classes migration', '\npoints\nviewer_sessions')
          if any(value in text for value in forbidden):
              raise SystemExit('STATE_TRUTH_OBSOLETE')
          PY
          echo 'STATE_TRUTH_CORRECTION=PASS'

  final-integrity:
    needs: intermediate-gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: FINAL_INTEGRITY
        run: |
          git fetch origin feat/stracker-native-location-sharing-v1 --no-tags
          test "$(git rev-parse HEAD)" = '${{ github.event.pull_request.head.sha }}'
          test "$(git merge-base HEAD origin/feat/stracker-native-location-sharing-v1)" = 'b001814b675fb8c8cf2713ff4728cd250e8a25c8'
          test ! -e .github/workflows/native-sharing-cloudflare-lockgen.yml
          test ! -e .github/workflows/native-sharing-cloudflare-browser-diagnostic.yml
          python scripts/security/native-sharing-cloudflare-release-scan.py --root .
          git diff --check
          echo 'CI_FINAL=SUCCESS'
          echo 'MERGE=NO'
          echo 'DEPLOY=NO'
          echo 'LIVE_INFRASTRUCTURE=NO'
