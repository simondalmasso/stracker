name: STRACKER Native Sharing Cloudflare Lockgen

on:
  pull_request:
    branches:
      - feat/stracker-native-location-sharing-v1
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  lockgen:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4
      - name: Generate exact lockfile
        run: |
          cp package.json /tmp/package.before.json
          bun install --lockfile-only
          cmp package.json /tmp/package.before.json
          test "$(git diff --name-only | sort)" = 'bun.lock'
          grep -q '"tw-animate-css": "\^1.3.5"' package.json
          grep -q '"@cloudflare/vitest-pool-workers": "\^0.16.20"' package.json
          grep -q '"vitest": "\^4.1.0"' package.json
      - name: Commit lockfile linearly
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          git fetch origin "$HEAD_BRANCH" --no-tags
          test "$(git rev-parse origin/$HEAD_BRANCH)" = "$EXPECTED_HEAD"
          git config user.name 'stracker-ci'
          git config user.email 'stracker-ci@users.noreply.github.com'
          git add bun.lock
          git commit -m 'build: synchronize Phase B Bun lockfile'
          git push origin "HEAD:$HEAD_BRANCH"
