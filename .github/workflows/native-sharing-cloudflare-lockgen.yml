name: STRACKER Native Sharing Cloudflare Lockgen

on:
  pull_request:
    branches:
      - feat/stracker-native-location-sharing-v1
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  lockgen:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4
      - name: Generate lockfile
        run: bun install --lockfile-only
      - name: Verify requested packages
        run: |
          grep -q '"vitest"' package.json
          grep -q '"@cloudflare/vitest-pool-workers"' package.json
      - uses: actions/upload-artifact@v4
        with:
          name: native-sharing-cloudflare-lock-${{ github.event.pull_request.head.sha }}
          path: |
            package.json
            bun.lock
          if-no-files-found: error
          retention-days: 1
