name: STRACKER Dependency Lock Recovery

on:
  push:
    branches:
      - feat/stracker-controlled-physical-pilot-v1
    paths:
      - package.json
      - .github/workflows/stracker-dependency-lock-recovery.yml

permissions:
  contents: write

concurrency:
  group: stracker-dependency-lock-recovery
  cancel-in-progress: false

jobs:
  regenerate-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/stracker-controlled-physical-pilot-v1
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4
      - name: REGENERATE_PATCHED_LOCK
        run: |
          bun install --lockfile-only
          git diff --exit-code -- package.json
          bun audit --audit-level high
          git diff --check
          if git diff --quiet -- bun.lock; then
            echo 'LOCK_ALREADY_CURRENT=YES'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bun.lock
          git commit -m 'chore: refresh patched dependency lock'
          git push origin HEAD:feat/stracker-controlled-physical-pilot-v1
          echo 'PATCHED_LOCK_PUSHED=YES'
