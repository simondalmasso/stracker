name: STRACKER Basemap Runtime Diagnostic

on:
  pull_request:
    branches: [feat/stracker-cloudflare-private-gateway-poc]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  runtime-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4
      - run: bun install --frozen-lockfile
      - run: NEXT_TELEMETRY_DISABLED=1 bun run build:export
      - name: Capture browser scripts
        run: |
          python -m http.server 4173 --directory out >/tmp/http.txt 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
          set +e
          QA_RAW_OUTPUT=/tmp/mobile-results.json node tests/mobile_qa.mjs >/tmp/mobile-qa.txt 2>&1
          echo "mobile_qa_exit=$?" >/tmp/exits.txt
          QA_EXTENDED_OUTPUT=/tmp/mobile-extended-results.json node tests/vector_map_extended_qa.mjs >/tmp/mobile-extended.txt 2>&1
          echo "mobile_extended_exit=$?" >>/tmp/exits.txt
          QA_PERFORMANCE_OUTPUT=/tmp/mobile-performance-results.json node tests/vector_map_performance_gate.mjs >/tmp/mobile-performance.txt 2>&1
          echo "mobile_performance_exit=$?" >>/tmp/exits.txt
          QA_BASEMAP_OUTPUT=/tmp/basemap-modes-results.json node tests/basemap_modes_qa.mjs >/tmp/basemap-modes.txt 2>&1
          echo "basemap_modes_exit=$?" >>/tmp/exits.txt
          exit 0
      - name: Capture provider scripts
        run: |
          set +e
          OPENFREEMAP_LIVE_OUTPUT=/tmp/openfreemap-live-results.json node tools/map-spike/validate-openfreemap-live.mjs >/tmp/openfreemap-live.txt 2>&1
          echo "openfreemap_exit=$?" >>/tmp/exits.txt
          SATELLITE_PROVIDER_OUTPUT=/tmp/satellite-provider-results.json node tools/map-spike/validate-satellite-providers.mjs >/tmp/satellite-provider.txt 2>&1
          echo "satellite_provider_exit=$?" >>/tmp/exits.txt
          exit 0
      - name: Inspect public provider catalogs
        run: |
          node --input-type=module <<'NODE' >/tmp/catalog-inspect.txt 2>&1
          import { VectorTile } from '@mapbox/vector-tile'
          import Pbf from 'pbf'
          const styleUrl = 'https://tiles.openfreemap.org/styles/liberty'
          const style = await (await fetch(styleUrl)).json()
          const entry = Object.entries(style.sources || {}).find(([, source]) => source?.type === 'vector')
          console.log('OPENFREEMAP_SOURCE', JSON.stringify(entry))
          let source = entry?.[1]
          let tiles = source?.tiles
          let tileJson = null
          if (!tiles && source?.url) {
            tileJson = await (await fetch(new URL(source.url, styleUrl))).json()
            tiles = tileJson.tiles
          }
          console.log('OPENFREEMAP_TILEJSON', JSON.stringify(tileJson))
          const lng = -60.7103
          const lat = -31.6575
          const zoom = 14
          const scale = 2 ** zoom
          const x = Math.floor(((lng + 180) / 360) * scale)
          const radians = lat * Math.PI / 180
          const y = Math.floor((1 - Math.asinh(Math.tan(radians)) / Math.PI) / 2 * scale)
          for (const candidateY of [y, scale - y - 1]) {
            const template = String(tiles?.[0] || '')
            const url = template.replace('{z}', String(zoom)).replace('{x}', String(x)).replace('{y}', String(candidateY)).replace('{-y}', String(scale - candidateY - 1))
            const response = await fetch(url)
            const buffer = Buffer.from(await response.arrayBuffer())
            const summary = { status: response.status, bytes: buffer.length, layers: {} }
            if (response.ok && buffer.length) {
              try {
                const tile = new VectorTile(new Pbf(buffer))
                summary.layers = Object.fromEntries(Object.entries(tile.layers).map(([name, layer]) => [name, layer.length]))
              } catch (error) {
                summary.decodeError = String(error)
              }
            }
            console.log('OPENFREEMAP_TILE', candidateY === y ? 'XYZ' : 'TMS', JSON.stringify(summary))
          }
          const capabilitiesUrl = 'https://tiles.maps.eox.at/wmts/1.0.0/WMTSCapabilities.xml'
          const capabilitiesResponse = await fetch(capabilitiesUrl)
          const xml = await capabilitiesResponse.text()
          const identifiers = [...xml.matchAll(/<(?:ows:)?Identifier>([^<]+)<\/(?:ows:)?Identifier>/g)].map((match) => match[1])
          console.log('EOX_CAPABILITIES_STATUS', capabilitiesResponse.status)
          console.log('EOX_CLOUDLESS_IDENTIFIERS', JSON.stringify([...new Set(identifiers.filter((value) => /cloud|sentinel|2016/i.test(value)))].sort()))
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: stracker-basemap-runtime-diagnostic-${{ github.event.pull_request.head.sha }}
          path: |
            /tmp/exits.txt
            /tmp/http.txt
            /tmp/mobile-qa.txt
            /tmp/mobile-extended.txt
            /tmp/mobile-performance.txt
            /tmp/basemap-modes.txt
            /tmp/openfreemap-live.txt
            /tmp/satellite-provider.txt
            /tmp/catalog-inspect.txt
            /tmp/mobile-results.json
            /tmp/mobile-extended-results.json
            /tmp/mobile-performance-results.json
            /tmp/basemap-modes-results.json
            /tmp/openfreemap-live-results.json
            /tmp/satellite-provider-results.json
          if-no-files-found: warn
          retention-days: 1
