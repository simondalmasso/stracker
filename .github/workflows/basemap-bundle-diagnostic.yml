name: STRACKER Basemap Bundle Diagnostic

on:
  pull_request:
    branches:
      - feat/stracker-cloudflare-private-gateway-poc
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  bundle-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4
      - run: bun install --frozen-lockfile
      - run: NEXT_TELEMETRY_DISABLED=1 bun run build:export
      - name: Capture bundle gate
        run: |
          set +e
          node tools/map-spike/release-bundle-gate.mjs >/tmp/bundle-gate.txt 2>&1
          code=$?
          echo "exit=$code" >>/tmp/bundle-gate.txt
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: stracker-basemap-bundle-diagnostic-${{ github.event.pull_request.head.sha }}
          path: /tmp/bundle-gate.txt
          retention-days: 1
