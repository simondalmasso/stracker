name: STRACKER Cloudflare Private Gateway PoC

on:
  pull_request:
    branches:
      - feat/stracker-mobile-session-product-v1
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: stracker-cloudflare-private-gateway-poc-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gateway-poc-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Verify stacked base
        run: |
          test "$(git merge-base HEAD origin/feat/stracker-mobile-session-product-v1)" = "166bf8e316cabd4806ade4fb4c21a20d2ad2040a"
          git diff --check origin/feat/stracker-mobile-session-product-v1...HEAD
          echo 'STACKED_BASE_CHECK=PASS'

      - name: Frozen install
        run: |
          bun install --frozen-lockfile
          echo 'BUN_FROZEN_INSTALL=PASS'

      - name: Python dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Backend tests
        run: |
          python -m py_compile tracker_map.py nextjs-ui/tracker_map.py stracker_security.py stracker_session.py
          python -m unittest discover -s tests -p 'test_*.py'
          cmp tracker_map.py nextjs-ui/tracker_map.py
          echo 'BACKEND_TESTS=PASS'

      - name: ESLint
        run: |
          bun run lint
          echo 'ESLINT=PASS'

      - name: Typecheck
        run: |
          bun run typecheck
          echo 'TYPECHECK=PASS'

      - name: Gateway syntax
        run: bun run gateway:syntax

      - name: Access JWT validation
        run: |
          bun run test:access-jwt
          echo 'ACCESS_JWT_VALIDATION=PASS'

      - name: Gateway tests
        run: |
          bun run test:gateway
          echo 'GATEWAY_TESTS=PASS'

      - name: Mock end-to-end
        run: |
          bun run test:gateway-e2e
          echo 'MOCK_E2E=PASS'

      - name: Product security invariants
        run: |
          bun run test:gateway-invariants
          echo 'SERVICE_TOKEN_IN_BUNDLE=PENDING_BUILD_SCAN'

      - name: Static export build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: |
          bun run build:export
          test -f out/index.html
          echo 'STATIC_EXPORT_BUILD=PASS'

      - name: Bundle and repository security scan
        run: |
          ! grep -R --binary-files=without-match -n 'X-Stracker-Service-Token\|MOCK_SERVICE_TOKEN_TEST_ONLY' out
          ! grep -R --binary-files=without-match -n 'onrender\.com\|strackerglm' out gateway/src gateway/wrangler.jsonc
          ! git grep -nE 'wrangler[[:space:]]+deploy' -- .github gateway package.json
          test ! -e .env
          ! git ls-files --error-unmatch tsconfig.tsbuildinfo
          echo 'SERVICE_TOKEN_IN_BUNDLE=NO'
          echo 'OPEN_PROXY=NO'
          echo 'SSRF=BLOCKED'

      - name: Wrangler versions upload dry-run
        run: |
          bun run gateway:wrangler-dry-run
          echo 'WRANGLER_DRY_RUN=PASS'

      - name: Mobile browser QA
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: |
          python -m http.server 4173 --directory out >/tmp/stracker-mobile-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4173/ >/dev/null
          bun tests/mobile_qa.mjs
          echo 'MY_LOCATION_INDEPENDENT=PASS'
          echo 'SHARED_LOCATION_FAIL_CLOSED=PASS'
          echo 'MOBILE_QA=PASS'

      - name: Final integrity
        run: |
          git diff --check
          test ! -e .env
          echo 'CI_FINAL=SUCCESS'
