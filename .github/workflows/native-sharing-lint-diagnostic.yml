name: STRACKER Native Sharing Lint Diagnostic

on:
  pull_request:
    branches:
      - feat/stracker-vector-map-engine-v1
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4
      - run: bun install --frozen-lockfile
      - name: Capture lint output
        run: |
          set +e
          bun run lint >/tmp/lint-main.txt 2>&1
          echo $? >/tmp/lint-main-exit.txt
          bunx eslint src/app/share src/app/shared native-sharing/src >/tmp/lint-native.txt 2>&1
          echo $? >/tmp/lint-native-exit.txt
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: native-sharing-lint-diagnostic-${{ github.event.pull_request.head.sha }}
          path: /tmp/lint-*.txt
          if-no-files-found: error
          retention-days: 1
