name: STRACKER P0 Cleanup V2

on:
  pull_request:
    branches: [main]
    types: [synchronize]
    paths:
      - .github/workflows/p0-cleanup-v2.yml

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE_SHA: 923cac9c9bcc0b7e05701dd1018e61a454d0f478
      STRACKER_ENV: test
      STRACKER_API_TOKEN: test-service-token-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
      SECRET_KEY: test-secret-key-ssssssssssssssssssssssssssssssssssssssssssssssss
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/stracker-p0-security-canonical-state
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Restore generated file and correct evidence
        shell: bash
        run: |
          set -euo pipefail
          git fetch --prune origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          test ! -e package-lock.json
          test ! -e npm-shrinkwrap.json
          test -f bun.lock
          git checkout "$BASE_SHA" -- tsconfig.tsbuildinfo
          python - <<'PY'
          from pathlib import Path

          validation_path = Path('docs/P0_VALIDATION.md')
          validation = validation_path.read_text(encoding='utf-8')
          if validation.count('NPM_CI_EUSAGE | 0 | 0 |') != 2:
              raise SystemExit('unexpected npm-ci evidence count')
          validation = validation.replace('NPM_CI_EUSAGE | 0 | 0 |', 'NPM_CI_EUSAGE_NO_NPM_LOCKFILE | 0 | 0 |')
          old = 'Package names and raw logs are intentionally omitted. Matching base/candidate classification and counts identify the failure as preexisting.'
          new = ('`npm ci` fails with EUSAGE because neither `package-lock.json` nor `npm-shrinkwrap.json` exists; '
                 'the only committed JavaScript lockfile is `bun.lock`. Base and candidate have the same files and exit code, '
                 'so this is a preexisting package-manager mismatch rather than a P0 regression. Package names and raw logs are omitted.')
          if old not in validation:
              raise SystemExit('validation explanation not found')
          validation_path.write_text(validation.replace(old, new, 1), encoding='utf-8')

          current_path = Path('docs/CURRENT_STATE.md')
          current = current_path.read_text(encoding='utf-8')
          old_lockfiles = 'LOCKFILES=package-lock.json,bun.lock'
          if old_lockfiles not in current:
              raise SystemExit('current-state lockfile line not found')
          current_path.write_text(current.replace(old_lockfiles, 'LOCKFILES=bun.lock', 1), encoding='utf-8')
          PY
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m py_compile tracker_map.py nextjs-ui/tracker_map.py stracker_security.py tests/test_p0_security.py
          python -m unittest discover -s tests -p 'test_*.py' -q
          cmp tracker_map.py nextjs-ui/tracker_map.py
          git diff --check
          rm -f .github/workflows/p0-cleanup.yml .github/workflows/p0-cleanup-v2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs: finalize P0 lockfile evidence'
          git push origin HEAD:fix/stracker-p0-security-canonical-state
