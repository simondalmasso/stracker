name: STRACKER Native Sharing Cloudflare Browser Diagnostic

on:
  pull_request:
    branches:
      - feat/stracker-native-location-sharing-v1
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4
      - run: bun install --frozen-lockfile
      - name: Build static export
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: bun run build:export
      - name: Capture browser output
        env:
          QA_CLOUDFLARE_OUTPUT: /tmp/native-sharing-cloudflare-browser.json
        run: |
          set +e
          bun tests/native-sharing-cloudflare/browser-runtime-qa.ts >/tmp/browser-runtime.log 2>&1
          exit_code=$?
          set -e
          printf '%s\n' "$exit_code" >/tmp/browser-runtime-exit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-sharing-cloudflare-browser-diagnostic-${{ github.event.pull_request.head.sha }}
          path: |
            /tmp/browser-runtime.log
            /tmp/browser-runtime-exit.txt
            /tmp/native-sharing-cloudflare-browser.json
          if-no-files-found: warn
          retention-days: 1
      - name: Preserve browser exit status
        if: always()
        run: exit "$(cat /tmp/browser-runtime-exit.txt)"
