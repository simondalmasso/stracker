name: STRACKER Native Sharing Cloudflare Diagnostic

on:
  pull_request:
    branches:
      - feat/stracker-native-location-sharing-v1
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4
      - run: bun install --frozen-lockfile
      - name: Capture runtime test output
        run: |
          set +e
          bun test tests/native-sharing-cloudflare/runtime.test.ts >/tmp/runtime-tests.log 2>&1
          exit_code=$?
          set -e
          printf '%s\n' "$exit_code" >/tmp/runtime-tests-exit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-sharing-cloudflare-diagnostic-${{ github.event.pull_request.head.sha }}
          path: |
            /tmp/runtime-tests.log
            /tmp/runtime-tests-exit.txt
          if-no-files-found: error
          retention-days: 1
      - name: Preserve test exit status
        if: always()
        run: exit "$(cat /tmp/runtime-tests-exit.txt)"
