name: STRACKER Runtime Typecheck Diagnostic

on:
  pull_request:
    branches:
      - feat/stracker-vector-map-engine-v1
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4
      - name: FROZEN_INSTALL
        run: bun install --frozen-lockfile
      - name: Capture runtime typecheck
        run: |
          set +e
          bun run runtime:typecheck > /tmp/runtime-typecheck.txt 2>&1
          code=$?
          echo "$code" > /tmp/runtime-typecheck-exit.txt
          exit 0
      - name: Upload diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: runtime-typecheck-diagnostic-${{ github.event.pull_request.head.sha }}
          path: |
            /tmp/runtime-typecheck.txt
            /tmp/runtime-typecheck-exit.txt
          if-no-files-found: error
          retention-days: 1
