name: STRACKER Native Sharing Cloudflare Bun Diagnostic

on:
  pull_request:
    branches:
      - feat/stracker-native-location-sharing-v1
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4
      - name: Frozen install
        run: bun install --frozen-lockfile
      - name: Run Bun adapter tests
        id: tests
        shell: bash
        run: |
          set +e
          bun test tests/native-sharing-cloudflare/runtime.test.ts > /tmp/bun-adapter.log 2>&1
          code=$?
          echo "$code" > /tmp/bun-adapter-exit.txt
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-sharing-cloudflare-bun-diagnostic-${{ github.event.pull_request.head.sha }}
          path: |
            /tmp/bun-adapter.log
            /tmp/bun-adapter-exit.txt
          if-no-files-found: error
          retention-days: 1
      - name: Preserve test exit code
        if: always()
        run: exit "$(cat /tmp/bun-adapter-exit.txt)"
