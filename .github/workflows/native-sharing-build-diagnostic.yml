name: STRACKER Native Sharing Build Diagnostic

on:
  pull_request:
    branches:
      - feat/stracker-vector-map-engine-v1
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4
      - run: bun install --frozen-lockfile
      - name: Capture export output
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: |
          set +e
          bun run build:export >/tmp/build-export.txt 2>&1
          echo $? >/tmp/build-export-exit.txt
          find out -maxdepth 4 -print | sort >/tmp/build-export-tree.txt 2>&1
          for command in \
            'test -f out/index.html' \
            'test -f out/share/index.html' \
            'test -f out/shared/index.html' \
            'test ! -d out/shared/__capability__' \
            "test ! -e 'src/app/shared/[capability]'" \
            "! find out/shared -mindepth 1 -type d -print -quit | grep -q ."; do
            sh -c "$command"
            printf '%s=%s\n' "$command" "$?" >>/tmp/build-export-checks.txt
          done
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: native-sharing-build-diagnostic-${{ github.event.pull_request.head.sha }}
          path: /tmp/build-export*.txt
          if-no-files-found: error
          retention-days: 1
