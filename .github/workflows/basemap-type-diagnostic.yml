name: STRACKER Basemap Type Diagnostic

on:
  pull_request:
    branches:
      - feat/stracker-cloudflare-private-gateway-poc
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  type-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4
      - run: bun install --frozen-lockfile
      - name: Capture typecheck
        run: |
          set +e
          bun run typecheck >/tmp/typecheck.txt 2>&1
          code=$?
          echo "exit=$code" >>/tmp/typecheck.txt
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: stracker-basemap-type-diagnostic-${{ github.event.pull_request.head.sha }}
          path: /tmp/typecheck.txt
          retention-days: 1
