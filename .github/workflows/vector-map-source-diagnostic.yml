name: STRACKER Vector Map Source Diagnostic

on:
  pull_request:
    branches:
      - feat/stracker-cloudflare-private-gateway-poc
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4
      - name: Frozen install
        run: bun install --frozen-lockfile
      - name: Structured release source gate
        run: node tools/map-spike/release-source-gate.mjs
      - name: Build static product
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: bun run build:export
      - name: Mobile QA diagnostics
        continue-on-error: true
        env:
          QA_RAW_OUTPUT: /tmp/mobile-results.json
          QA_EXTENDED_OUTPUT: /tmp/mobile-extended-results.json
          QA_PERFORMANCE_OUTPUT: /tmp/mobile-performance-results.json
        run: |
          python -m http.server 4173 --directory out >/tmp/http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
          set +e
          node tests/mobile_qa.mjs > /tmp/mobile-qa.log 2>&1
          echo "mobile_qa_exit=$?" > /tmp/mobile-exits.txt
          node tests/vector_map_extended_qa.mjs > /tmp/mobile-extended.log 2>&1
          echo "extended_exit=$?" >> /tmp/mobile-exits.txt
          node tests/vector_map_performance_gate.mjs > /tmp/mobile-performance.log 2>&1
          echo "performance_exit=$?" >> /tmp/mobile-exits.txt
          exit 0
      - name: Renderer diagnostic
        continue-on-error: true
        run: |
          mkdir -p /tmp/stracker-mapbox-benchmark
          npm install --prefix /tmp/stracker-mapbox-benchmark --ignore-scripts --no-audit --no-fund 'mapbox-gl@3.26.0' >/tmp/mapbox-install.log 2>&1
          set +e
          MAPBOX_BENCHMARK_ROOT=/tmp/stracker-mapbox-benchmark MAP_SPIKE_OUTPUT=/tmp/renderer-results.json node tools/map-spike/run-benchmark.mjs >/tmp/renderer.log 2>&1
          echo "renderer_exit=$?" > /tmp/renderer-exit.txt
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: stracker-vector-map-diagnostics-${{ github.event.pull_request.head.sha }}
          path: |
            /tmp/mobile-qa.log
            /tmp/mobile-extended.log
            /tmp/mobile-performance.log
            /tmp/mobile-exits.txt
            /tmp/http.log
            /tmp/renderer.log
            /tmp/renderer-exit.txt
            /tmp/mapbox-install.log
            /tmp/mobile-results.json
            /tmp/mobile-extended-results.json
            /tmp/mobile-performance-results.json
            /tmp/renderer-results.json
          if-no-files-found: warn
          retention-days: 2
