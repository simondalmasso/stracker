name: STRACKER Native Sharing Compensation Test Fix

on:
  pull_request:
    branches:
      - feat/stracker-native-location-sharing-v1
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Replace schema-absence assertion with data-absence assertion
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/native-sharing-cloudflare/workerd-atomicity.test.ts')
          text = path.read_text()
          old = """    await runInDurableObject(object, async (_instance: NativeSharingDurableObject, state) => {
      const tables = state.storage.sql.exec<{ name: string }>(
        `SELECT name FROM sqlite_master
         WHERE type = 'table' AND name IN (
           'sharing_session', 'accepted_points', 'viewer_sessions', 'rate_or_sequence_state'
         )`,
      ).toArray()
      expect(tables).toEqual([])
      expect(await state.storage.getAlarm()).toBeNull()
    })
"""
          new = """    await runInDurableObject(object, async (_instance: NativeSharingDurableObject, state) => {
      const counts = {
        sessions: state.storage.sql.exec<{ count: number }>('SELECT COUNT(*) AS count FROM sharing_session').toArray()[0]?.count ?? -1,
        points: state.storage.sql.exec<{ count: number }>('SELECT COUNT(*) AS count FROM accepted_points').toArray()[0]?.count ?? -1,
        viewers: state.storage.sql.exec<{ count: number }>('SELECT COUNT(*) AS count FROM viewer_sessions').toArray()[0]?.count ?? -1,
        sequenceStates: state.storage.sql.exec<{ count: number }>('SELECT COUNT(*) AS count FROM rate_or_sequence_state').toArray()[0]?.count ?? -1,
      }
      expect(counts).toEqual({ sessions: 0, points: 0, viewers: 0, sequenceStates: 0 })
      expect(await state.storage.getAlarm()).toBeNull()
    })
"""
          if old not in text:
              raise SystemExit('expected compensation block not found')
          path.write_text(text.replace(old, new))
          PY
          rm .github/workflows/native-sharing-cloudflare-compensation-test-fix.yml
          git diff --check
      - name: Commit exact proof correction
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name 'stracker-ci'
          git config user.email 'stracker-ci@users.noreply.github.com'
          git add -A
          git commit -m 'test: verify alarm compensation by empty state'
          git push origin "HEAD:$HEAD_BRANCH"
