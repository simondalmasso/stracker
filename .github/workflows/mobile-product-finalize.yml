name: STRACKER Mobile Product Finalize

on:
  pull_request:
    branches: [fix/stracker-p0-security-canonical-state]
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: read

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/stracker-mobile-session-product-v1
          fetch-depth: 0
          persist-credentials: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply integrations
        run: |
          python scripts/apply_mobile_product_v1.py
          python scripts/fix_mobile_frontend_gates.py
      - name: Frozen install
        run: bun install --frozen-lockfile
      - name: Backend gates
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m py_compile tracker_map.py nextjs-ui/tracker_map.py stracker_security.py stracker_session.py
          python -m unittest discover -s tests -p 'test_*.py'
          cmp tracker_map.py nextjs-ui/tracker_map.py
      - name: Frontend gates
        run: |
          bun run lint
          bun run typecheck
          BUILD_EXPORT=1 bun run build
      - name: Integrity gates
        run: |
          git diff --check
          test ! -e .env
          test -f out/index.html
          test "$(git merge-base HEAD origin/fix/stracker-p0-security-canonical-state)" = "fa919edad57937481f97e74ac96f09697bf03642"
      - name: Publish generated product
        run: |
          rm -f .github/workflows/mobile-product-implement.yml .github/workflows/mobile-product-finalize.yml scripts/apply_mobile_product_v1.py scripts/fix_mobile_frontend_gates.py
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: implement mobile location source product v1'
          git push origin HEAD:feat/stracker-mobile-session-product-v1
