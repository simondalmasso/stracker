name: STRACKER Native Sharing Browser Diagnostic

on:
  pull_request:
    branches:
      - feat/stracker-vector-map-engine-v1
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4
      - run: bun install --frozen-lockfile
      - name: Build static export
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: bun run build:export
      - name: Capture browser QA output
        env:
          QA_BASE_URL: http://127.0.0.1:4173
          QA_NATIVE_OUTPUT: /tmp/native-sharing-browser.json
        run: |
          node tests/native-sharing/static-server.mjs >/tmp/native-sharing-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
          set +e
          node tests/native-sharing/browser-qa.mjs >/tmp/native-sharing-browser.log 2>&1
          echo $? >/tmp/native-sharing-browser-exit.txt
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: native-sharing-browser-diagnostic-${{ github.event.pull_request.head.sha }}
          path: |
            /tmp/native-sharing-browser.log
            /tmp/native-sharing-browser-exit.txt
            /tmp/native-sharing-http.log
            /tmp/native-sharing-browser.json
          if-no-files-found: warn
          retention-days: 1
