name: STRACKER Release Alignment V1

on:
  pull_request:
    branches:
      - feat/stracker-native-sharing-worker-sqlite-e2e-v1
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: stracker-release-alignment-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  align:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/stracker-native-sharing-lifecycle-isolation-abuse-e2e-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}
      - name: ALIGN_RELEASE_SCRIPTS
        run: |
          python - <<'PY'
          from pathlib import Path

          validation = Path('scripts/release/validate-same-domain.sh')
          text = validation.read_text()
          old = "assert config['preview_urls'] is True"
          if old not in text:
              raise SystemExit('VALIDATION_PREVIEW_ASSERTION_NOT_FOUND')
          validation.write_text(text.replace(old, "assert config['preview_urls'] is False"))

          release = Path('scripts/release/cloudflare-same-domain-release.sh')
          text = release.read_text()
          if text.count(old) != 1:
              raise SystemExit('RELEASE_PREVIEW_ASSERTION_NOT_FOUND')
          text = text.replace(old, "assert config['preview_urls'] is False")
          strict = '  --strict \\\n'
          if strict not in text:
              raise SystemExit('STRICT_FLAG_NOT_FOUND')
          text = text.replace(strict, '')
          preview_alias = '  --message "STRACKER same-domain minimum usable ${SOURCE_SHA}" \\\n  --preview-alias "$PREVIEW_ALIAS"'
          if preview_alias not in text:
              raise SystemExit('PREVIEW_ALIAS_BLOCK_NOT_FOUND')
          text = text.replace(preview_alias, '  --message "STRACKER same-domain minimum usable ${SOURCE_SHA}"')
          preview_loop = '''preview_ok=0
for _ in {1..18}; do
  if curl --fail --silent --show-error --max-time 20 "$PREVIEW_URL" >/dev/null 2>&1; then
    preview_ok=1
    break
  fi
  sleep 5
done
'''
          if preview_loop not in text:
              raise SystemExit('PREVIEW_LOOP_NOT_FOUND')
          text = text.replace(preview_loop, "preview_ok=0\necho 'PREVIEW_URLS_DISABLED_USING_ZERO_PERCENT_OVERRIDE=YES'\n")
          release.write_text(text)
          PY
          git diff --check
      - name: COMMIT_ALIGNMENT
        run: |
          if git diff --quiet -- scripts/release/validate-same-domain.sh scripts/release/cloudflare-same-domain-release.sh; then
            echo 'RELEASE_ALIGNMENT_ALREADY_CURRENT=YES'
            exit 0
          fi
          git config user.name 'stracker-arq-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add scripts/release/validate-same-domain.sh scripts/release/cloudflare-same-domain-release.sh
          git commit -m 'fix: align release upload with existing Worker settings'
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
          echo 'RELEASE_ALIGNMENT_COMMITTED=YES'
