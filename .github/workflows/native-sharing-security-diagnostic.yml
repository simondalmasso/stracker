name: STRACKER Native Sharing Security Diagnostic

on:
  pull_request:
    branches:
      - feat/stracker-vector-map-engine-v1
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: bun install --frozen-lockfile
      - name: Build export for scanner scope
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: bun run build:export
      - name: Capture sanitized scanner result
        run: |
          set +e
          python tests/security/native-sharing-release-scan.test.py > /tmp/scanner-tests.txt 2>&1
          tests_exit=$?
          python scripts/security/native-sharing-release-scan.py --root . > /tmp/scanner-findings.jsonl
          scanner_exit=$?
          set -e
          printf '%s\n' "$tests_exit" > /tmp/scanner-tests-exit.txt
          printf '%s\n' "$scanner_exit" > /tmp/scanner-exit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-sharing-security-diagnostic-${{ github.event.pull_request.head.sha }}
          path: |
            /tmp/scanner-findings.jsonl
            /tmp/scanner-tests-exit.txt
            /tmp/scanner-exit.txt
          if-no-files-found: error
          retention-days: 1
      - name: Preserve scanner exit status
        if: always()
        run: |
          test "$(cat /tmp/scanner-tests-exit.txt)" = '0'
          exit "$(cat /tmp/scanner-exit.txt)"
