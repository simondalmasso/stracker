name: STRACKER Same-Domain Hard Execution V1

on:
  pull_request:
    branches:
      - feat/stracker-native-sharing-worker-sqlite-e2e-v1
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: stracker-same-domain-hard-execution-${{ github.event.pull_request.number }}
  cancel-in-progress: false

env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
  FROZEN_BASE_SHA: 53cef936fe416519861f4889ddc2898468f24723
  FROZEN_BASE_BRANCH: feat/stracker-native-sharing-worker-sqlite-e2e-v1

jobs:
  validation:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/stracker-native-sharing-lifecycle-isolation-abuse-e2e-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: VALIDATE_EXACT_HEAD
        run: bash scripts/release/validate-same-domain.sh
      - name: UPLOAD_VALIDATION_EVIDENCE
        uses: actions/upload-artifact@v4
        with:
          name: stracker-same-domain-validation-${{ github.event.pull_request.head.sha }}-${{ github.run_id }}
          path: ${{ env.VALIDATION_EVIDENCE_DIR }}
          if-no-files-found: error
          retention-days: 7

  release:
    needs: validation
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/stracker-native-sharing-lifecycle-isolation-abuse-e2e-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4
      - name: EXACT_HEAD_RECHECK
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git fetch origin "$FROZEN_BASE_BRANCH" --no-tags
          test "$(git rev-parse "origin/$FROZEN_BASE_BRANCH")" = "$FROZEN_BASE_SHA"
          test "$(git merge-base HEAD "origin/$FROZEN_BASE_BRANCH")" = "$FROZEN_BASE_SHA"
          echo 'EXACT_HEAD_RECHECK=PASS'
      - name: FROZEN_INSTALL
        run: bun install --frozen-lockfile
      - name: UPLOAD_PREVIEW_DEPLOY_VERIFY_OR_ROLLBACK
        run: bash scripts/release/cloudflare-same-domain-release.sh
      - name: UPLOAD_RELEASE_EVIDENCE
        uses: actions/upload-artifact@v4
        with:
          name: stracker-same-domain-release-${{ github.event.pull_request.head.sha }}-${{ github.run_id }}
          path: |
            ${{ env.RELEASE_EVIDENCE_DIR }}/release-evidence.json
            ${{ env.RELEASE_EVIDENCE_DIR }}/release-evidence.sha256
          if-no-files-found: error
          retention-days: 14
