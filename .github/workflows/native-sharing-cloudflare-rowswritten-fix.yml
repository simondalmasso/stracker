name: STRACKER Native Sharing Cloudflare RowsWritten Fix

on:
  pull_request:
    branches:
      - feat/stracker-native-location-sharing-v1
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Apply exact cursor-consumption correction
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('native-sharing-cloudflare/src/sqlite-store.ts')
          text = path.read_text()
          if 'function completedRowsWritten' not in text:
              marker = "function count(cursor: RuntimeSqlCursor<RuntimeSqlRow & { count: number }>): number {\n  return Number(one(cursor)?.count ?? 0)\n}\n"
              helper = marker + "\nfunction completedRowsWritten(cursor: RuntimeSqlCursor<RuntimeSqlRow>): number {\n  cursor.toArray()\n  return cursor.rowsWritten\n}\n"
              if marker not in text:
                  raise SystemExit('count helper marker missing')
              text = text.replace(marker, helper)
          text = re.sub(r'\b([A-Za-z][A-Za-z0-9_]*)\.rowsWritten\b', r'completedRowsWritten(\1)', text)
          # Restore the helper's own direct property read after the generic replacement.
          text = text.replace('return completedRowsWritten(cursor)', 'return cursor.rowsWritten')
          path.write_text(text)

          runtime_test = Path('tests/native-sharing-cloudflare/runtime.test.ts')
          test_text = runtime_test.read_text().replace(
              "test('uses SQLite conditional writes for concurrent point writes'",
              "test('rejects a stale expected sequence with conditional SQLite writes'",
          )
          runtime_test.write_text(test_text)
          PY
          git diff --check
          git diff --exit-code --quiet && exit 0
      - name: Commit linear correction
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name 'stracker-ci'
          git config user.email 'stracker-ci@users.noreply.github.com'
          git add native-sharing-cloudflare/src/sqlite-store.ts tests/native-sharing-cloudflare/runtime.test.ts
          git commit -m 'fix: consume workerd SQL cursors before rowsWritten checks'
          git push origin "HEAD:$HEAD_BRANCH"
