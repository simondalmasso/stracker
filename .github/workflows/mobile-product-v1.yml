name: STRACKER Mobile Product V1

on:
  pull_request:
    branches:
      - fix/stracker-p0-security-canonical-state
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: stracker-mobile-product-v1
  cancel-in-progress: true

jobs:
  canonical-build-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4
      - name: Verify stacked base
        run: |
          test "$(git merge-base HEAD origin/fix/stracker-p0-security-canonical-state)" = "fa919edad57937481f97e74ac96f09697bf03642"
          git diff --check origin/fix/stracker-p0-security-canonical-state...HEAD
      - name: Frozen install
        run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Typecheck
        run: bunx tsc --noEmit
      - name: Build
        env:
          BUILD_EXPORT: "1"
        run: bun run build
