name: STRACKER Mobile Product V1

on:
  pull_request:
    branches:
      - fix/stracker-p0-security-canonical-state
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: stracker-mobile-product-v1
  cancel-in-progress: true

jobs:
  canonical-build-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4
      - name: Verify stacked base
        run: |
          test "$(git merge-base HEAD origin/fix/stracker-p0-security-canonical-state)" = "fa919edad57937481f97e74ac96f09697bf03642"
          git diff --check origin/fix/stracker-p0-security-canonical-state...HEAD
      - name: Frozen install
        run: bun install --frozen-lockfile
      - name: Capture frontend gates
        id: gates
        shell: bash
        run: |
          set +e
          mkdir -p ci-evidence
          bun run lint > ci-evidence/lint.log 2>&1
          lint_rc=$?
          bunx tsc --noEmit > ci-evidence/typecheck.log 2>&1
          type_rc=$?
          BUILD_EXPORT=1 bun run build > ci-evidence/build.log 2>&1
          build_rc=$?
          printf 'FROZEN_INSTALL=PASS\nLINT_EXIT=%s\nTYPECHECK_EXIT=%s\nBUILD_EXIT=%s\n' "$lint_rc" "$type_rc" "$build_rc" > ci-evidence/summary.txt
          cat ci-evidence/summary.txt
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: mobile-product-baseline-diagnostics
          path: ci-evidence
          if-no-files-found: error
      - name: Enforce gates
        run: |
          . ci-evidence/summary.txt
          test "$LINT_EXIT" = "0"
          test "$TYPECHECK_EXIT" = "0"
          test "$BUILD_EXIT" = "0"
