name: STRACKER Mobile Product V1

on:
  pull_request:
    branches:
      - fix/stracker-p0-security-canonical-state
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: stracker-mobile-product-v1-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  mobile-product-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Verify stacked base
        run: |
          test "$(git merge-base HEAD origin/fix/stracker-p0-security-canonical-state)" = "fa919edad57937481f97e74ac96f09697bf03642"
          git diff --check origin/fix/stracker-p0-security-canonical-state...HEAD

      - name: Frozen install
        run: bun install --frozen-lockfile

      - name: Python dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Backend gates
        run: |
          python -m py_compile tracker_map.py nextjs-ui/tracker_map.py stracker_security.py stracker_session.py
          python -m unittest discover -s tests -p 'test_*.py'
          cmp tracker_map.py nextjs-ui/tracker_map.py

      - name: ESLint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Static export build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: bun run build:export

      - name: Mobile browser QA
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: |
          python -m http.server 4173 --directory out >/tmp/stracker-mobile-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4173/ >/dev/null
          bun tests/mobile_qa.mjs

      - name: Security and artifact integrity
        run: |
          test ! -e .env
          test -f out/index.html
          ! git ls-files --error-unmatch tsconfig.tsbuildinfo
          ! grep -R --binary-files=without-match -n 'STRACKER_API_TOKEN\|X-Stracker-Service-Token' out
          git diff --check
