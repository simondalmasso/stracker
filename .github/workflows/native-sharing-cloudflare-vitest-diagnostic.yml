name: STRACKER Native Sharing Cloudflare Vitest Diagnostic

on:
  pull_request:
    branches:
      - feat/stracker-native-location-sharing-v1
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4
      - name: Frozen install
        run: bun install --frozen-lockfile
      - name: Run exact verbose workerd test command
        id: vitest
        shell: bash
        run: |
          set +e
          bun run test:native-sharing-cloudflare:vitest -- --reporter=verbose > /tmp/workerd-vitest.log 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-sharing-cloudflare-vitest-diagnostic-${{ github.event.pull_request.head.sha }}
          path: /tmp/workerd-vitest.log
          if-no-files-found: error
          retention-days: 1
      - name: Preserve Vitest exit code
        if: always()
        run: exit '${{ steps.vitest.outputs.exit_code }}'
